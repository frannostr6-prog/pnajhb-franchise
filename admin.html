<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNA JHB — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ef;--card:#fff;--border:#e2ddd6;--text:#1a1714;--muted:#7a756e;--accent:#c8402a;--accent-light:#fdf0ed;--accent-dark:#9e3220;--green:#2a7a4b;--green-light:#edf7f2;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
header{background:var(--text);color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;}
.logo{font-size:15px;font-weight:600;letter-spacing:.04em;}.logo span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:10px;}
.admin-badge{font-size:11px;background:var(--accent);padding:3px 8px;border-radius:20px;font-weight:500;}
.nav-link{color:#fff;opacity:.7;font-size:13px;text-decoration:none;}.nav-link:hover{opacity:1;}

/* Tabs */
.tabs{background:var(--card);border-bottom:2px solid var(--border);display:flex;padding:0 16px;}
.tab{padding:14px 18px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;}
.tab-content{display:none;}.tab-content.active{display:block;}

.container{max-width:980px;margin:0 auto;padding:20px 16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:600;margin-bottom:14px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:500px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:4px;}.field.full{grid-column:1/-1;}
label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
input,textarea,select{padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;width:100%;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:#fff;}
textarea{resize:vertical;min-height:64px;}
.img-upload{border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;background:var(--bg);}
.img-upload:hover{border-color:var(--accent);}
.img-upload input{display:none;}
.img-preview{width:68px;height:68px;object-fit:cover;border-radius:8px;margin:0 auto 8px;display:block;}
.upload-text{font-size:12px;color:var(--muted);}
.btn{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none;display:inline-flex;align-items:center;gap:5px;}
.btn-red{background:var(--accent);color:#fff;}.btn-red:hover{background:var(--accent-dark);}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.btn-edit{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;margin-right:4px;}
.btn-edit:hover{border-color:var(--text);color:var(--text);}
.btn-green{background:var(--green);color:#fff;}.btn-green:hover{opacity:.9;}
.save-msg{font-size:13px;color:var(--green);font-weight:500;margin-top:8px;display:none;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#faf9f7;}
.price-cell{font-family:"DM Mono",monospace;font-weight:500;color:var(--accent);}
.rrp-cell{font-family:"DM Mono",monospace;color:var(--muted);}
.code-cell{font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);}
.thumb{width:36px;height:36px;object-fit:cover;border-radius:6px;background:var(--bg);display:block;border:1px solid var(--border);}
.thumb-ph{width:36px;height:36px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid var(--border);}
.row-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.count-badge{font-size:12px;background:var(--bg);border:1px solid var(--border);padding:3px 10px;border-radius:20px;color:var(--muted);}
.empty-box{text-align:center;padding:40px;color:var(--muted);}
.search-input{padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;width:200px;}
.search-input:focus{border-color:var(--accent);}

/* Orders tab */
.order-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.order-card-header{padding:13px 16px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;gap:8px;}
.order-card-header:hover{background:#faf9f7;}
.order-franchise{font-weight:600;font-size:14px;}
.order-date{font-size:11px;color:var(--muted);margin-top:2px;}
.order-header-right{text-align:right;flex-shrink:0;}
.order-total-big{font-family:"DM Mono",monospace;font-weight:600;color:var(--accent);font-size:15px;}
.order-item-count{font-size:11px;color:var(--muted);margin-top:2px;}
.order-detail{display:none;border-top:1px solid var(--border);padding:0;}
.order-detail.open{display:block;}
.order-detail table{font-size:13px;}
.order-detail th{background:var(--bg);}
.order-actions{padding:12px 16px;display:flex;gap:8px;border-top:1px solid var(--border);background:var(--bg);}
.status-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;}
.status-new{background:#e6f1fb;color:#185fa5;}
.status-done{background:var(--green-light);color:var(--green);}
.chevron{font-size:12px;color:var(--muted);margin-left:6px;transition:transform .2s;}
.chevron.open{transform:rotate(180deg);}
.orders-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
</style>
</head>
<body>
<header>
  <div class="logo">PNA<span>JHB</span> Admin</div>
  <div class="header-right">
    <a href="index.html" class="nav-link">← View portal</a>
    <span class="admin-badge">Admin</span>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('products')">📦 Products <span class="tab-badge" id="prod-badge">0</span></button>
  <button class="tab" onclick="switchTab('orders')">📋 Orders <span class="tab-badge" id="order-badge" style="background:var(--green)">0</span></button>
</div>

<!-- PRODUCTS TAB -->
<div class="tab-content active" id="tab-products">
  <div class="container">
    <div class="card">
      <div class="card-title" id="form-title">➕ Add new product</div>
      <div class="form-grid">
        <div class="field"><label>Product code *</label><input type="text" id="p-code" placeholder="e.g. 35730450"/></div>
        <div class="field"><label>Product name *</label><input type="text" id="p-name" placeholder="e.g. BEADS 4 SIZE MET ASST"/></div>
        <div class="field"><label>Sell price excl VAT (R) *</label><input type="number" id="p-price" placeholder="0.00" step="0.01" min="0"/></div>
        <div class="field"><label>RRP incl VAT (R) *</label><input type="number" id="p-rrp" placeholder="0.00" step="0.01" min="0"/></div>
        <div class="field full"><label>Description (optional)</label><textarea id="p-desc" placeholder="Short description..."></textarea></div>
        <div class="field full">
          <label>Product image</label>
          <label class="img-upload" id="upload-label">
            <input type="file" id="p-image" accept="image/*" onchange="previewImg(this)"/>
            <img id="img-preview" class="img-preview" style="display:none"/>
            <div class="upload-text" id="upload-text">📷 Click to upload photo</div>
          </label>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;align-items:center;">
        <button class="btn btn-red" onclick="saveProduct()">Save product</button>
        <button class="btn btn-ghost" onclick="resetForm()">Cancel</button>
      </div>
      <div class="save-msg" id="save-msg">✅ Saved!</div>
    </div>

    <div class="card">
      <div class="row-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:14px;font-weight:600;">All products</span>
          <span class="count-badge" id="prod-count">0</span>
        </div>
        <input class="search-input" type="text" placeholder="Search..." oninput="renderTable(this.value)"/>
      </div>
      <div class="tbl-wrap"><div id="prod-table"></div></div>
    </div>
  </div>
</div>

<!-- ORDERS TAB -->
<div class="tab-content" id="tab-orders">
  <div class="container">
    <div class="orders-toolbar">
      <span style="font-size:14px;font-weight:600;">Incoming orders</span>
      <span class="count-badge" id="orders-count">0 orders</span>
      <button class="btn btn-green" onclick="exportAllCSV()" style="margin-left:auto;padding:8px 14px;font-size:12px;">⬇ Export all to CSV</button>
      <button class="btn btn-ghost" onclick="clearOrders()">Clear all</button>
    </div>
    <div id="orders-list"><div class="empty-box">No orders yet. Orders placed by franchisees will appear here.</div></div>
  </div>
</div>

let imgData='';
let editId=null;

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.tab[onclick*="${name}"]`).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='orders') renderOrders();
}

function previewImg(inp){
  if(!inp.files||!inp.files[0]) return;
  const r=new FileReader();
  r.onload=e=>{imgData=e.target.result;const p=document.getElementById('img-preview');p.src=imgData;p.style.display='block';document.getElementById('upload-text').style.display='none';};
  r.readAsDataURL(inp.files[0]);
}

function saveProduct(){
  const code=document.getElementById('p-code').value.trim();
  const name=document.getElementById('p-name').value.trim();
  const price=parseFloat(document.getElementById('p-price').value);
  const rrp=parseFloat(document.getElementById('p-rrp').value);
  const desc=document.getElementById('p-desc').value.trim();
  if(!code||!name||!price||!rrp){alert('Please fill in code, name, sell price and RRP.');return;}
  if(editId){
    const idx=products.findIndex(p=>p.id===editId);
    if(idx!==-1) products[idx]={...products[idx],code,name,price,rrp,description:desc,image:imgData||products[idx].image};
    editId=null;
    document.getElementById('form-title').textContent='➕ Add new product';
  } else {
    products.push({id:code,code,name,price,rrp,description:desc,image:imgData});
  }
  localStorage.setItem('pna_products',JSON.stringify(products));
  resetForm();
  document.getElementById('save-msg').style.display='block';
  setTimeout(()=>document.getElementById('save-msg').style.display='none',2000);
  renderTable();
}

function resetForm(){
  ['p-code','p-name','p-price','p-rrp','p-desc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('img-preview').style.display='none';
  document.getElementById('upload-text').style.display='block';
  document.getElementById('p-image').value='';
  imgData='';editId=null;
  document.getElementById('form-title').textContent='➕ Add new product';
}

function editProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  editId=id;
  document.getElementById('p-code').value=p.code;
  document.getElementById('p-name').value=p.name;
  document.getElementById('p-price').value=p.price;
  document.getElementById('p-rrp').value=p.rrp;
  document.getElementById('p-desc').value=p.description||'';
  if(p.image){imgData=p.image;const pr=document.getElementById('img-preview');pr.src=p.image;pr.style.display='block';document.getElementById('upload-text').style.display='none';}
  document.getElementById('form-title').textContent='✏️ Edit product';
  window.scrollTo({top:0,behavior:'smooth'});
  switchTab('products');
}

function deleteProduct(id){
  if(!confirm('Delete this product?'))return;
  products=products.filter(p=>p.id!==id);
  localStorage.setItem('pna_products',JSON.stringify(products));
  renderTable();
}

function renderTable(q=''){
  const list=q?products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())||p.code.includes(q)):products;
  document.getElementById('prod-count').textContent=products.length+' products';
  document.getElementById('prod-badge').textContent=products.length;
  const el=document.getElementById('prod-table');
  if(!list.length){el.innerHTML='<div class="empty-box">No products found.</div>';return;}
  el.innerHTML=`<table>
    <thead><tr><th></th><th>Code</th><th>Name</th><th>Sell price</th><th>RRP</th><th></th></tr></thead>
    <tbody>${list.map(p=>`<tr>
      <td>${p.image?`<img class="thumb" src="${p.image}" alt="${p.name}"/>`:'<div class="thumb-ph">📦</div>'}</td>
      <td class="code-cell">${p.code}</td>
      <td style="font-weight:500;max-width:220px;">${p.name}</td>
      <td class="price-cell">R${parseFloat(p.price).toFixed(2)}</td>
      <td class="rrp-cell">R${parseFloat(p.rrp).toFixed(2)}</td>
      <td style="white-space:nowrap;">
        <button class="btn-edit" onclick="editProduct('${p.id}')">Edit</button>
        <button class="btn-ghost" onclick="deleteProduct('${p.id}')">Delete</button>
      </td>
    </tr>`).join('')}</tbody></table>`;
}

function renderOrders(){
  const orders=JSON.parse(localStorage.getItem('pna_orders')||'[]');
  const el=document.getElementById('orders-list');
  document.getElementById('orders-count').textContent=orders.length+' order'+(orders.length!==1?'s':'');
  document.getElementById('order-badge').textContent=orders.length;
  if(!orders.length){el.innerHTML='<div class="empty-box">No orders yet. Orders placed by franchisees will appear here.</div>';return;}
  el.innerHTML=[...orders].reverse().map((o,i)=>{
    const items=Array.isArray(o.items)?o.items:[];
    const itemCount=items.length||'—';
    return `<div class="order-card">
      <div class="order-card-header" onclick="toggleOrder('o${i}')">
        <div>
          <div class="order-franchise">${o.franchiseName} <span class="status-badge status-new">New</span></div>
          <div class="order-date">${o.date}</div>
        </div>
        <div class="order-header-right">
          <div class="order-total-big">R${o.total}</div>
          <div class="order-item-count">${itemCount} line${itemCount!==1?'s':''} <span class="chevron" id="chev-o${i}">▼</span></div>
        </div>
      </div>
      <div class="order-detail" id="od-o${i}">
        ${items.length?`<table>
          <thead><tr><th>Code</th><th>Description</th><th>Qty</th><th>Unit price</th><th>Subtotal</th></tr></thead>
          <tbody>${items.map(it=>`<tr>
            <td class="code-cell">${it.code}</td>
            <td style="font-weight:500;">${it.name}</td>
            <td style="font-family:DM Mono,monospace;">${it.qty}</td>
            <td class="price-cell">R${parseFloat(it.price).toFixed(2)}</td>
            <td class="price-cell">R${parseFloat(it.subtotal).toFixed(2)}</td>
          </tr>`).join('')}</tbody>
          <tfoot><tr><td colspan="4" style="text-align:right;font-weight:600;padding:10px 12px;border-top:2px solid var(--border);">Total (excl VAT)</td><td class="price-cell" style="border-top:2px solid var(--border);font-size:14px;">R${o.total}</td></tr></tfoot>
        </table>`:'<div style="padding:14px 16px;font-size:13px;color:var(--muted);">'+o.items+'</div>'}
        <div class="order-actions">
          <button class="btn btn-green" style="font-size:12px;padding:7px 12px;" onclick="exportOrderCSV(${JSON.stringify(o).replace(/"/g,'&quot;')})">⬇ CSV</button>
          <button class="btn btn-ghost" onclick="markDone('${o.id||i}')">✓ Mark done</button>
          <button class="btn btn-ghost" style="margin-left:auto;" onclick="deleteOrder('${o.id||i}')">Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleOrder(id){
  const el=document.getElementById('od-'+id);
  const chev=document.getElementById('chev-'+id);
  el.classList.toggle('open');
  chev.classList.toggle('open');
}

function exportOrderCSV(o){
  const items=Array.isArray(o.items)?o.items:[];
  let csv=`Franchise,${o.franchiseName}\nDate,${o.date}\n\nCode,Description,Qty,Sell Price (excl VAT),RRP (incl VAT),Subtotal\n`;
  csv+=items.map(it=>`${it.code},"${it.name}",${it.qty},${parseFloat(it.price).toFixed(2)},${it.rrp?parseFloat(it.rrp).toFixed(2):''},${parseFloat(it.subtotal).toFixed(2)}`).join('\n');
  csv+=`\n\nTotal (excl VAT),,,,,${o.total}`;
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`Order_${o.franchiseName.replace(/\s+/g,'_')}_${o.date.replace(/[/:,\s]/g,'-')}.csv`;
  a.click();
}

function exportAllCSV(){
  const orders=JSON.parse(localStorage.getItem('pna_orders')||'[]');
  if(!orders.length){alert('No orders to export.');return;}
  let csv='Franchise,Date,Code,Description,Qty,Sell Price (excl VAT),Subtotal,Order Total\n';
  orders.forEach(o=>{
    const items=Array.isArray(o.items)?o.items:[{code:'',name:o.items,qty:'',price:'',subtotal:''}];
    items.forEach(it=>{
      csv+=`"${o.franchiseName}","${o.date}",${it.code||''},"${it.name||''}",${it.qty||''},${it.price?parseFloat(it.price).toFixed(2):''},${it.subtotal?parseFloat(it.subtotal).toFixed(2):''},${o.total}\n`;
    });
  });
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`All_Orders_${new Date().toLocaleDateString('en-ZA').replace(/\//g,'-')}.csv`;
  a.click();
}

function deleteOrder(id){
  if(!confirm('Delete this order?'))return;
  let orders=JSON.parse(localStorage.getItem('pna_orders')||'[]');
  orders=orders.filter((o,i)=>(o.id||String(i))!==String(id));
  localStorage.setItem('pna_orders',JSON.stringify(orders));
  renderOrders();
}

function markDone(id){
  let orders=JSON.parse(localStorage.getItem('pna_orders')||'[]');
  const o=orders.find((o,i)=>(o.id||String(i))===String(id));
  if(o) o.status='done';
  localStorage.setItem('pna_orders',JSON.stringify(orders));
  renderOrders();
}

function clearOrders(){
  if(!confirm('Clear all orders?'))return;
  localStorage.removeItem('pna_orders');
  renderOrders();
}

window.addEventListener('storage',e=>{if(e.key==='pna_orders')renderOrders();});
renderTable();
renderOrders();
</script>
</body>
</html>
