<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNA JHB — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ef;--card:#fff;--border:#e2ddd6;--text:#1a1714;--muted:#7a756e;--accent:#c8402a;--accent-light:#fdf0ed;--accent-dark:#9e3220;--green:#2a7a4b;--green-light:#edf7f2;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
header{background:var(--text);color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;}
.logo{font-size:15px;font-weight:600;letter-spacing:.04em;}.logo span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:10px;}
.admin-badge{font-size:11px;background:var(--accent);padding:3px 8px;border-radius:20px;font-weight:500;}
.nav-link{color:#fff;opacity:.7;font-size:13px;text-decoration:none;}.nav-link:hover{opacity:1;}
.tabs{background:var(--card);border-bottom:2px solid var(--border);display:flex;padding:0 16px;}
.tab{padding:14px 18px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;}
.badge-red{background:var(--accent);color:#fff;}
.badge-green{background:var(--green);color:#fff;}
.tab-content{display:none;}.tab-content.active{display:block;}
.container{max-width:1000px;margin:0 auto;padding:20px 16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:600;margin-bottom:14px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:500px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:4px;}.field.full{grid-column:1/-1;}
label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
input,textarea{padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;width:100%;}
input:focus,textarea:focus{border-color:var(--accent);background:#fff;}
textarea{resize:vertical;min-height:60px;}
.fselect{padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;width:100%;cursor:pointer;}
.fselect:focus{border-color:var(--accent);}
.img-upload{border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;background:var(--bg);}
.img-upload:hover{border-color:var(--accent);}
.img-upload input{display:none;}
.img-preview{width:68px;height:68px;object-fit:cover;border-radius:8px;margin:0 auto 8px;display:block;}
.upload-text{font-size:12px;color:var(--muted);}
.btn{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none;display:inline-flex;align-items:center;gap:5px;}
.btn-red{background:var(--accent);color:#fff;}.btn-red:hover{background:var(--accent-dark);}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.btn-edit{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;margin-right:4px;}
.btn-edit:hover{border-color:var(--text);color:var(--text);}
.btn-picking{background:var(--text);color:#fff;font-size:12px;padding:7px 14px;border-radius:6px;cursor:pointer;font-family:inherit;border:none;display:inline-flex;align-items:center;gap:5px;}
.btn-picking:hover{opacity:.85;}
.save-msg{font-size:13px;color:var(--green);font-weight:500;margin-top:8px;display:none;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#faf9f7;}
.price-cell{font-family:"DM Mono",monospace;font-weight:500;color:var(--accent);}
.rrp-cell{font-family:"DM Mono",monospace;color:var(--muted);}
.code-cell{font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);}
.cat-pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;background:var(--accent-light);color:var(--accent);}
.thumb{width:36px;height:36px;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--border);}
.thumb-ph{width:36px;height:36px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid var(--border);}
.row-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.count-badge{font-size:12px;background:var(--bg);border:1px solid var(--border);padding:3px 10px;border-radius:20px;color:var(--muted);}
.empty-box{text-align:center;padding:40px;color:var(--muted);}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.search-input{padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;}
.search-input:focus{border-color:var(--accent);}
.filter-select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;cursor:pointer;}
.order-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.order-card-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;gap:8px;}
.order-card-header:hover{background:#faf9f7;}
.order-franchise{font-weight:600;font-size:15px;}
.order-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.order-total-units{font-family:"DM Mono",monospace;font-weight:700;color:var(--text);font-size:16px;}
.order-lines-count{font-size:11px;color:var(--muted);margin-top:3px;}
.chevron{font-size:11px;color:var(--muted);margin-left:5px;display:inline-block;transition:transform .2s;}
.chevron.open{transform:rotate(180deg);}
.order-detail{display:none;border-top:1px solid var(--border);}
.order-detail.open{display:block;}
.order-detail table{font-size:13px;}
.order-detail th{font-size:10px;}
.order-actions{padding:12px 16px;display:flex;gap:8px;border-top:1px solid var(--border);background:var(--bg);flex-wrap:wrap;}
.new-dot{width:7px;height:7px;background:var(--green);border-radius:50%;display:inline-block;margin-right:5px;}
.orders-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.notes-badge{font-size:11px;background:#fef9e7;border:1px solid #f0e68c;color:#7a6000;padding:2px 8px;border-radius:20px;}
.sync-btn{background:var(--green);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;}
.sync-btn:hover{opacity:.9;}
</style>
</head>
<body>
<header>
  <div class="logo">PNA<span>JHB</span> Admin</div>
  <div class="header-right">
    <a href="index.html" class="nav-link">&#x2190; View portal</a>
    <span class="admin-badge">Admin</span>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('products')">&#x1F4E6; Products <span class="tab-badge badge-red" id="prod-badge">0</span></button>
  <button class="tab" onclick="switchTab('orders')">&#x1F4CB; Orders <span class="tab-badge badge-green" id="order-badge">0</span></button>
</div>

<!-- PRODUCTS TAB -->
<div class="tab-content active" id="tab-products">
  <div class="container">
    <div class="card">
      <div class="card-title" id="form-title">&#x2795; Add new product</div>
      <div class="form-grid">
        <div class="field"><label>Product code *</label><input type="text" id="p-code" placeholder="e.g. 44640006"/></div>
        <div class="field"><label>Product name *</label><input type="text" id="p-name" placeholder="e.g. BRD CHIP GREY 1200G A0"/></div>
        <div class="field"><label>Category *</label>
          <select class="fselect" id="p-cat"><option value="Chip Board">Chip Board</option><option value="Craft">Craft</option><option value="Lever Arch">Lever Arch</option><option value="Mont Marte">Mont Marte</option><option value="Paper">Paper</option><option value="Spray Paint">Spray Paint</option></select>
        </div>
        <div class="field"><label>Sell price excl VAT (R)</label><input type="number" id="p-price" placeholder="0.00" step="0.01" min="0"/></div>
        <div class="field"><label>RRP incl VAT (R)</label><input type="number" id="p-rrp" placeholder="0.00" step="0.01" min="0"/></div>
        <div class="field full"><label>Description (optional)</label><textarea id="p-desc" placeholder="Short description..."></textarea></div>
        <div class="field full">
          <label>Product image</label>
          <label class="img-upload">
            <input type="file" id="p-image" accept="image/*" onchange="previewImg(this)"/>
            <img id="img-preview" class="img-preview" style="display:none"/>
            <div class="upload-text" id="upload-text">&#x1F4F7; Click to upload photo</div>
          </label>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;align-items:center;">
        <button class="btn btn-red" onclick="saveProduct()">Save product</button>
        <button class="btn btn-ghost" onclick="resetForm()">Cancel</button>
      </div>
      <div class="save-msg" id="save-msg">&#x2705; Saved!</div>
    </div>
    <div class="card">
      <div class="row-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:14px;font-weight:600;">All products</span>
          <span class="count-badge" id="prod-count">0</span>
        </div>
        <div class="filter-row">
          <select class="filter-select" id="filter-cat" onchange="renderTable()">
            <option value="">All categories</option><option value="Chip Board">Chip Board</option><option value="Craft">Craft</option><option value="Lever Arch">Lever Arch</option><option value="Mont Marte">Mont Marte</option><option value="Paper">Paper</option><option value="Spray Paint">Spray Paint</option>
          </select>
          <input class="search-input" type="text" placeholder="Search..." id="prod-search" oninput="renderTable()"/>
        </div>
      </div>
      <div class="tbl-wrap"><div id="prod-table"></div></div>
    </div>
  </div>
</div>

<!-- ORDERS TAB -->
<div class="tab-content" id="tab-orders">
  <div class="container">
    <div class="orders-toolbar">
      <span style="font-size:15px;font-weight:600;">Incoming orders</span>
      <span class="count-badge" id="orders-count">0 orders</span>
      <button class="sync-btn" onclick="syncFromSheet()" title="Pull latest orders from Google Sheets">&#x21BA; Sync from Sheet</button>
      <button class="btn btn-ghost" style="margin-left:auto;" onclick="clearOrders()">Clear all</button>
    </div>
    <div id="sync-status" style="font-size:12px;color:var(--muted);margin-bottom:12px;display:none;"></div>
    <div id="orders-list"></div>
  </div>
</div>

const CATEGORIES = ["Chip Board", "Craft", "Lever Arch", "Mont Marte", "Paper", "Spray Paint"];
let imgData='', editId=null;

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.tab[onclick*="${name}"]`).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='orders') renderOrders();
}

function previewImg(inp){
  if(!inp.files||!inp.files[0]) return;
  const r=new FileReader();
  r.onload=e=>{imgData=e.target.result;const p=document.getElementById('img-preview');p.src=imgData;p.style.display='block';document.getElementById('upload-text').style.display='none';};
  r.readAsDataURL(inp.files[0]);
}

function saveProduct(){
  const code=document.getElementById('p-code').value.trim();
  const name=document.getElementById('p-name').value.trim();
  const cat=document.getElementById('p-cat').value;
  const price=parseFloat(document.getElementById('p-price').value)||0;
  const rrp=parseFloat(document.getElementById('p-rrp').value)||0;
  const desc=document.getElementById('p-desc').value.trim();
  if(!code||!name||!cat){alert('Please fill in code, name and category.');return;}
  if(editId){
    const idx=products.findIndex(p=>p.id===editId);
    if(idx!==-1) products[idx]={...products[idx],code,name,category:cat,price,rrp,description:desc,image:imgData||products[idx].image};
    editId=null; document.getElementById('form-title').innerHTML='&#x2795; Add new product';
  } else {
    products.push({id:cat.substring(0,3).toUpperCase()+'-'+code, code, name, category:cat, price, rrp, description:desc, image:imgData});
  }
  localStorage.setItem('pna_products',JSON.stringify(products));
  resetForm();
  document.getElementById('save-msg').style.display='block';
  setTimeout(()=>document.getElementById('save-msg').style.display='none',2000);
  renderTable();
}

function resetForm(){
  ['p-code','p-name','p-price','p-rrp','p-desc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('img-preview').style.display='none';
  document.getElementById('upload-text').style.display='block';
  document.getElementById('p-image').value='';
  imgData=''; editId=null;
  document.getElementById('form-title').innerHTML='&#x2795; Add new product';
}

function editProduct(id){
  const p=products.find(x=>x.id===id); if(!p) return;
  editId=id;
  document.getElementById('p-code').value=p.code;
  document.getElementById('p-name').value=p.name;
  document.getElementById('p-cat').value=p.category;
  document.getElementById('p-price').value=p.price||'';
  document.getElementById('p-rrp').value=p.rrp||'';
  document.getElementById('p-desc').value=p.description||'';
  if(p.image){imgData=p.image;const pr=document.getElementById('img-preview');pr.src=p.image;pr.style.display='block';document.getElementById('upload-text').style.display='none';}
  document.getElementById('form-title').innerHTML='&#x270F;&#xFE0F; Edit product';
  window.scrollTo({top:0,behavior:'smooth'});
  switchTab('products');
}

function deleteProduct(id){
  if(!confirm('Delete this product?')) return;
  products=products.filter(p=>p.id!==id);
  localStorage.setItem('pna_products',JSON.stringify(products));
  renderTable();
}

function renderTable(){
  const q=document.getElementById('prod-search').value.toLowerCase();
  const catFilter=document.getElementById('filter-cat').value;
  let list=products.filter(p=>{
    const matchCat=!catFilter||p.category===catFilter;
    const matchQ=!q||p.name.toLowerCase().includes(q)||p.code.includes(q);
    return matchCat&&matchQ;
  });
  document.getElementById('prod-count').textContent=products.length+' products';
  document.getElementById('prod-badge').textContent=products.length;
  const el=document.getElementById('prod-table');
  if(!list.length){el.innerHTML='<div class="empty-box">No products found.</div>';return;}
  el.innerHTML=`<table>
    <thead><tr><th></th><th>Code</th><th>Name</th><th>Category</th><th>Sell price</th><th>RRP</th><th></th></tr></thead>
    <tbody>${list.map(p=>`<tr>
      <td>${p.image?`<img class="thumb" src="${p.image}" alt="${p.name}"/>`:'<div class="thumb-ph">&#x1F4E6;</div>'}</td>
      <td class="code-cell">${p.code}</td>
      <td style="font-weight:500;max-width:200px;">${p.name}</td>
      <td><span class="cat-pill">${p.category}</span></td>
      <td class="price-cell">${p.price>0?'R'+parseFloat(p.price).toFixed(2):'&#x2014;'}</td>
      <td class="rrp-cell">${p.rrp>0?'R'+parseFloat(p.rrp).toFixed(2):'&#x2014;'}</td>
      <td style="white-space:nowrap;">
        <button class="btn-edit" onclick="editProduct('${p.id}')">Edit</button>
        <button class="btn-ghost" onclick="deleteProduct('${p.id}')">Delete</button>
      </td>
    </tr>`).join('')}</tbody></table>`;
}

function renderOrders(){
  const orders=JSON.parse(localStorage.getItem('pna_orders')||'[]');
  document.getElementById('orders-count').textContent=orders.length+' order'+(orders.length!==1?'s':'');
  document.getElementById('order-badge').textContent=orders.length;
  const el=document.getElementById('orders-list');
  if(!orders.length){el.innerHTML='<div class="empty-box">No orders yet.<br><small style="color:var(--muted);margin-top:6px;display:block;">Orders appear here when franchisees submit. Click Sync to pull from Google Sheets.</small></div>';return;}
  el.innerHTML=[...orders].reverse().map((o,i)=>{
    const items=Array.isArray(o.items)?o.items:[];
    const ref=o.orderRef||('ORD-'+String(o.id||i).slice(-6));
    const totalUnits=items.reduce((s,it)=>s+it.qty,0);
    const cats=[...new Set(items.map(it=>it.category))];
    return `<div class="order-card">
      <div class="order-card-header" onclick="toggleOrder('o${i}')">
        <div>
          <div class="order-franchise"><span class="new-dot"></span>${o.franchiseName}</div>
          <div class="order-meta">${ref} &nbsp;&#xB7;&nbsp; ${o.date}</div>
          <div class="order-meta">${cats.join(', ')}</div>
          ${o.notes?`<div style="margin-top:4px;"><span class="notes-badge">&#x1F4DD; ${o.notes}</span></div>`:''}
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div class="order-total-units">${totalUnits} units</div>
          <div class="order-lines-count">${items.length} products <span class="chevron" id="chev-o${i}">&#x25BC;</span></div>
        </div>
      </div>
      <div class="order-detail" id="od-o${i}">
        <table>
          <thead><tr><th>Code</th><th>Description</th><th>Category</th><th>Qty ordered</th><th>RRP</th></tr></thead>
          <tbody>${items.map(it=>`<tr>
            <td class="code-cell">${it.code}</td>
            <td style="font-weight:500;">${it.name}</td>
            <td><span class="cat-pill">${it.category}</span></td>
            <td style="font-family:DM Mono,monospace;font-weight:700;font-size:15px;">${it.qty}</td>
            <td class="rrp-cell">${it.rrp>0?'R'+parseFloat(it.rrp).toFixed(2):'&#x2014;'}</td>
          </tr>`).join('')}</tbody>
        </table>
        <div class="order-actions">
          <button class="btn-picking" onclick="printPickingSlip(${i})">&#x1F5A8; Download Picking Slip</button>
          <button class="btn-ghost" onclick="deleteOrder('${o.id||i}')">Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function syncFromSheet(){
  const statusEl = document.getElementById('sync-status');
  statusEl.style.display='block';
  statusEl.textContent='Syncing from Google Sheets...';
  fetch(SCRIPT_URL+'?action=getOrders')
    .then(r=>r.json())
    .then(data=>{
      if(data.orders && data.orders.length){
        const existing = JSON.parse(localStorage.getItem('pna_orders')||'[]');
        const existingRefs = new Set(existing.map(o=>o.orderRef));
        const newOrders = data.orders.filter(o=>!existingRefs.has(o.orderRef));
        const merged = [...existing, ...newOrders];
        localStorage.setItem('pna_orders', JSON.stringify(merged));
        statusEl.textContent = `Synced! ${newOrders.length} new order${newOrders.length!==1?'s':''} added.`;
        renderOrders();
      } else {
        statusEl.textContent = 'Already up to date.';
      }
      setTimeout(()=>statusEl.style.display='none', 3000);
    })
    .catch(()=>{statusEl.textContent='Sync failed. Check your Google Apps Script URL.';});
}

function toggleOrder(id){
  document.getElementById('od-'+id).classList.toggle('open');
  document.getElementById('chev-'+id).classList.toggle('open');
}

function printPickingSlip(idx){
  const orders=[...JSON.parse(localStorage.getItem('pna_orders')||'[]')].reverse();
  const o=orders[idx]; if(!o) return;
  const items=Array.isArray(o.items)?o.items:[];
  const ref=o.orderRef||('ORD-'+String(o.id||idx).slice(-6));
  const cats=[...new Set(items.map(it=>it.category))];
  let tableRows='';
  cats.forEach(cat=>{
    const catItems=items.filter(it=>it.category===cat);
    tableRows+=`<tr style="background:#f5f3ef;"><td colspan="4" style="padding:8px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7a756e;border:1px solid #ddd;">${cat}</td></tr>`;
    catItems.forEach((it,i)=>{
      tableRows+=`<tr style="background:${i%2===0?'#fff':'#faf9f7'};">
        <td style="padding:8px 10px;border:1px solid #ddd;font-family:monospace;font-size:12px;">${it.code}</td>
        <td style="padding:8px 10px;border:1px solid #ddd;font-weight:500;">${it.name}</td>
        <td style="padding:8px 10px;border:1px solid #ddd;text-align:center;font-weight:700;font-size:16px;">${it.qty}</td>
        <td style="padding:8px 10px;border:1px solid #ddd;text-align:center;width:60px;"><span style="display:inline-block;width:40px;height:20px;border:1px solid #999;border-radius:3px;"></span></td>
      </tr>`;
    });
  });
  const totalUnits=items.reduce((s,it)=>s+it.qty,0);
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Picking Slip ${ref}</title>
  <style>
    body{font-family:Arial,sans-serif;padding:24px;color:#1a1714;font-size:13px;}
    .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:16px;border-bottom:3px solid #1a1714;}
    .company{font-size:24px;font-weight:700;}.company span{color:#c8402a;}
    .doc-title{font-size:20px;font-weight:700;text-transform:uppercase;color:#c8402a;text-align:right;}
    .meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;background:#f5f3ef;padding:14px;border-radius:8px;}
    .meta-item label{font-size:10px;font-weight:600;text-transform:uppercase;color:#7a756e;display:block;margin-bottom:3px;}
    .meta-item span{font-size:13px;font-weight:600;}
    table{width:100%;border-collapse:collapse;margin-bottom:20px;}
    thead{background:#1a1714;color:#fff;}
    thead th{padding:10px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;}
    thead th.center{text-align:center;}
    tfoot td{padding:10px;font-weight:700;font-size:13px;border-top:3px solid #1a1714;}
    .sig-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px;}
    .sig-box{border:1px solid #ddd;border-radius:6px;padding:10px 16px;text-align:center;font-size:11px;color:#7a756e;}
    .sig-line{border-bottom:1px solid #999;height:32px;margin-bottom:4px;}
    .footer{margin-top:16px;padding-top:12px;border-top:1px solid #ddd;display:flex;justify-content:space-between;font-size:10px;color:#7a756e;}
    @media print{@page{margin:15mm;}}
  </style></head><body>
  <div class="header">
    <div><div class="company">PNA<span>JHB</span></div><div style="font-size:12px;color:#7a756e;margin-top:3px;">Franchise Stock Orders</div></div>
    <div><div class="doc-title">Picking Slip</div><div style="font-size:12px;color:#7a756e;text-align:right;margin-top:4px;">${ref}</div></div>
  </div>
  <div class="meta-grid">
    <div class="meta-item"><label>Franchise</label><span>${o.franchiseName}</span></div>
    <div class="meta-item"><label>Order date</label><span>${o.date}</span></div>
    <div class="meta-item"><label>Order ref</label><span>${ref}</span></div>
    <div class="meta-item"><label>Total units</label><span>${totalUnits}</span></div>
  </div>
  ${o.notes?`<div style="background:#fef9e7;border:1px solid #f0e68c;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;">&#x1F4DD; <strong>Notes:</strong> ${o.notes}</div>`:''}
  <table>
    <thead><tr><th>Code</th><th>Description</th><th class="center">Qty to pick</th><th class="center">Picked &#x2713;</th></tr></thead>
    <tbody>${tableRows}</tbody>
    <tfoot><tr><td colspan="2" style="text-align:right;">Total units to pick</td><td colspan="2" style="font-family:monospace;">${totalUnits} units</td></tr></tfoot>
  </table>
  <div class="sig-grid">
    <div class="sig-box"><div class="sig-line"></div>Picked by</div>
    <div class="sig-box"><div class="sig-line"></div>Checked by</div>
    <div class="sig-box"><div class="sig-line"></div>Dispatched by</div>
  </div>
  <div class="footer">
    <span>PNA JHB &#x2014; Franchise Stock Orders</span>
    <span>Printed: ${new Date().toLocaleString('en-ZA')}</span>
    <span>${ref}</span>
  </div>
  </body></html>`);
  w.document.close();
  w.onload=()=>w.print();
}

function deleteOrder(id){
  if(!confirm('Delete this order?')) return;
  let orders=JSON.parse(localStorage.getItem('pna_orders')||'[]');
  orders=orders.filter((o,i)=>String(o.id||i)!==String(id));
  localStorage.setItem('pna_orders',JSON.stringify(orders));
  renderOrders();
}

function clearOrders(){
  if(!confirm('Clear all orders?')) return;
  localStorage.removeItem('pna_orders');
  renderOrders();
}

window.addEventListener('storage',e=>{if(e.key==='pna_orders')renderOrders();});
renderTable();
renderOrders();
</script>
