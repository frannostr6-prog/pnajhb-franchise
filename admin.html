<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNA JHB — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --border: #e2ddd6;
    --text: #1a1714;
    --muted: #7a756e;
    --accent: #c8402a;
    --accent-light: #fdf0ed;
    --accent-dark: #9e3220;
    --green: #2a7a4b;
    --green-light: #edf7f2;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: var(--text); color: #fff; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .logo { font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
  .logo span { color: var(--accent); }
  .admin-badge { font-size: 11px; background: var(--accent); padding: 3px 8px; border-radius: 20px; font-weight: 500; }

  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 24px; }

  /* Add product form */
  .form-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 24px; }
  .form-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  input, textarea { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); outline: none; width: 100%; }
  input:focus, textarea:focus { border-color: var(--accent); background: #fff; }
  textarea { resize: vertical; min-height: 70px; }

  /* Image upload */
  .img-upload { border: 2px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: border-color 0.15s; background: var(--bg); }
  .img-upload:hover { border-color: var(--accent); }
  .img-upload input { display: none; }
  .img-upload-text { font-size: 13px; color: var(--muted); }
  .img-preview { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; margin: 0 auto 8px; display: block; }

  .save-btn { margin-top: 16px; padding: 11px 24px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .save-btn:hover { background: var(--accent-dark); }

  /* Products table */
  .table-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .table-header h2 { font-size: 15px; font-weight: 600; }
  .count-badge { font-size: 12px; background: var(--bg); border: 1px solid var(--border); padding: 3px 10px; border-radius: 20px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--bg); }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #faf9f7; }
  .product-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; background: var(--bg); display: block; }
  .product-thumb-placeholder { width: 40px; height: 40px; border-radius: 6px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 18px; border: 1px solid var(--border); }
  .price-cell { font-family: 'DM Mono', monospace; font-weight: 500; color: var(--accent); }
  .delete-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--muted); font-family: inherit; }
  .delete-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .edit-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--muted); font-family: inherit; margin-right: 6px; }
  .edit-btn:hover { border-color: var(--text); color: var(--text); }
  .empty-table { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

  /* Orders section */
  .orders-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-top: 24px; }
  .order-row { padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .order-row:last-child { border-bottom: none; }
  .order-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .order-name { font-weight: 600; font-size: 14px; }
  .order-total { font-family: 'DM Mono', monospace; font-weight: 600; color: var(--accent); }
  .order-detail { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .clear-orders-btn { font-size: 12px; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; font-family: inherit; }

  .nav-link { color: #fff; opacity: 0.7; font-size: 13px; text-decoration: none; }
  .nav-link:hover { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">PNA<span>JHB</span> Admin</div>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="index.html" class="nav-link">← View portal</a>
    <span class="admin-badge">Admin</span>
  </div>
</header>

<div class="container">
  <h1>Product manager</h1>
  <p class="subtitle">Add products here — they appear instantly in the franchisee ordering portal.</p>

  <!-- Add Product Form -->
  <div class="form-card">
    <div class="form-title">➕ Add new product</div>
    <div class="form-grid">
      <div class="field">
        <label>Product name *</label>
        <input type="text" id="p-name" placeholder="e.g. Peri-peri sauce 500ml" />
      </div>
      <div class="field">
        <label>Selling price (R) *</label>
        <input type="number" id="p-price" placeholder="0.00" step="0.01" min="0" />
      </div>
      <div class="field full">
        <label>Description</label>
        <textarea id="p-desc" placeholder="Short description for franchisees..."></textarea>
      </div>
      <div class="field full">
        <label>Product image</label>
        <label class="img-upload" id="upload-label">
          <input type="file" id="p-image" accept="image/*" onchange="previewImage(this)" />
          <img id="img-preview" class="img-preview" style="display:none;" />
          <div class="img-upload-text" id="upload-text">📷 Click to upload photo (JPG, PNG)</div>
        </label>
      </div>
    </div>
    <button class="save-btn" onclick="addProduct()">Save product</button>
    <div id="save-msg" style="display:none; margin-top:10px; font-size:13px; color:var(--green); font-weight:500;">✅ Product saved!</div>
  </div>

  <!-- Products Table -->
  <div class="table-card">
    <div class="table-header">
      <h2>Products</h2>
      <span class="count-badge" id="product-count">0 products</span>
    </div>
    <div id="products-table"></div>
  </div>

  <!-- Orders -->
  <div class="orders-card">
    <div class="table-header">
      <h2>Incoming orders</h2>
      <button class="clear-orders-btn" onclick="clearOrders()">Clear all</button>
    </div>
    <div id="orders-list"></div>
  </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('pna_products') || '[]');
let orders = JSON.parse(localStorage.getItem('pna_orders') || '[]');
let imageDataUrl = '';
let editingId = null;

function previewImage(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    imageDataUrl = e.target.result;
    const preview = document.getElementById('img-preview');
    preview.src = imageDataUrl;
    preview.style.display = 'block';
    document.getElementById('upload-text').style.display = 'none';
  };
  reader.readAsDataURL(input.files[0]);
}

function addProduct() {
  const name = document.getElementById('p-name').value.trim();
  const price = document.getElementById('p-price').value;
  const desc = document.getElementById('p-desc').value.trim();

  if (!name || !price) { alert('Please enter a product name and price.'); return; }

  if (editingId) {
    const idx = products.findIndex(p => p.id === editingId);
    if (idx !== -1) {
      products[idx] = { ...products[idx], name, price: parseFloat(price), description: desc, image: imageDataUrl || products[idx].image };
    }
    editingId = null;
    document.querySelector('.save-btn').textContent = 'Save product';
    document.querySelector('.form-title').textContent = '➕ Add new product';
  } else {
    products.push({ id: Date.now().toString(), name, price: parseFloat(price), description: desc, image: imageDataUrl });
  }

  localStorage.setItem('pna_products', JSON.stringify(products));

  // Reset form
  document.getElementById('p-name').value = '';
  document.getElementById('p-price').value = '';
  document.getElementById('p-desc').value = '';
  document.getElementById('img-preview').style.display = 'none';
  document.getElementById('upload-text').style.display = 'block';
  document.getElementById('p-image').value = '';
  imageDataUrl = '';

  document.getElementById('save-msg').style.display = 'block';
  setTimeout(() => document.getElementById('save-msg').style.display = 'none', 2000);

  renderTable();
}

function editProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('p-name').value = p.name;
  document.getElementById('p-price').value = p.price;
  document.getElementById('p-desc').value = p.description || '';
  if (p.image) {
    imageDataUrl = p.image;
    const preview = document.getElementById('img-preview');
    preview.src = p.image;
    preview.style.display = 'block';
    document.getElementById('upload-text').style.display = 'none';
  }
  document.querySelector('.save-btn').textContent = 'Update product';
  document.querySelector('.form-title').textContent = '✏️ Edit product';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteProduct(id) {
  if (!confirm('Delete this product?')) return;
  products = products.filter(p => p.id !== id);
  localStorage.setItem('pna_products', JSON.stringify(products));
  renderTable();
}

function renderTable() {
  const container = document.getElementById('products-table');
  document.getElementById('product-count').textContent = products.length + ' product' + (products.length !== 1 ? 's' : '');

  if (products.length === 0) {
    container.innerHTML = '<div class="empty-table">No products yet. Add your first product above.</div>';
    return;
  }

  container.innerHTML = `
    <table>
      <thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Description</th><th></th></tr></thead>
      <tbody>
        ${products.map(p => `
          <tr>
            <td>${p.image ? `<img class="product-thumb" src="${p.image}" alt="${p.name}"/>` : `<div class="product-thumb-placeholder">📦</div>`}</td>
            <td style="font-weight:500;">${p.name}</td>
            <td class="price-cell">R${parseFloat(p.price).toFixed(2)}</td>
            <td style="color:var(--muted);max-width:200px;">${p.description || '—'}</td>
            <td>
              <button class="edit-btn" onclick="editProduct('${p.id}')">Edit</button>
              <button class="delete-btn" onclick="deleteProduct('${p.id}')">Delete</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderOrders() {
  const container = document.getElementById('orders-list');
  if (orders.length === 0) {
    container.innerHTML = '<div class="empty-table">No orders yet.</div>';
    return;
  }
  container.innerHTML = [...orders].reverse().map(o => `
    <div class="order-row">
      <div class="order-top">
        <div class="order-name">${o.franchiseName}</div>
        <div class="order-total">R${o.total}</div>
      </div>
      <div class="order-detail">${o.items}</div>
      <div class="order-detail">${o.date}</div>
    </div>
  `).join('');
}

function clearOrders() {
  if (!confirm('Clear all orders?')) return;
  orders = [];
  localStorage.setItem('pna_orders', JSON.stringify(orders));
  renderOrders();
}

// Listen for new orders from the franchisee portal (same browser localStorage)
window.addEventListener('storage', e => {
  if (e.key === 'pna_orders') {
    orders = JSON.parse(e.newValue || '[]');
    renderOrders();
  }
});

renderTable();
renderOrders();
</script>
</body>
</html>
