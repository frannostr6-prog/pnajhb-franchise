<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PNA JHB Franchise — Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;color:#222}
.header{background:#1a1a1a;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:100}
.header img{height:44px}
.header h1{font-size:17px;flex:1}
.tabs{display:flex;background:#222;padding:0 18px}
.tab{padding:10px 20px;cursor:pointer;color:#aaa;font-size:13px;border-bottom:3px solid transparent}
.tab.active{color:#fff;border-bottom-color:#e63329}
.container{max-width:1200px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:8px;padding:18px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card h2{font-size:14px;font-weight:600;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #e63329}
.form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.form-row input,.form-row select{flex:1;min-width:150px;padding:8px 10px;border:1px solid #ddd;border-radius:5px;font-size:13px}
.btn{padding:8px 18px;border:none;border-radius:5px;cursor:pointer;font-size:13px;font-weight:600}
.btn-red{background:#e63329;color:#fff}
.btn-dark{background:#333;color:#fff}
.btn-blue{background:#1a73e8;color:#fff}
.btn-del{background:#c00;color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.sb{font-size:12px;margin-top:6px;min-height:18px}
.sb.ok{color:#2a7}.sb.err{color:#c00}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:180px;padding:7px 10px;border:1px solid #ddd;border-radius:5px;font-size:13px}
.toolbar select{padding:7px 10px;border:1px solid #ddd;border-radius:5px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1a1a1a;color:#fff;padding:8px 10px;text-align:left}
td{padding:7px 10px;border-bottom:1px solid #eee;vertical-align:middle}
tr:hover td{background:#fafafa}
.img-cell{width:60px;text-align:center}
.img-cell img{width:48px;height:48px;object-fit:contain;border-radius:4px;cursor:pointer}
.no-img{color:#ccc;font-size:11px}
.price{color:#2a7;font-weight:600}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;padding:24px;border-radius:8px;text-align:center;max-width:420px;width:92%}
.img-upload-box{border:2px dashed #ccc;border-radius:6px;padding:14px;margin-bottom:12px;background:#fafafa}
.img-preview-wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.img-preview{width:72px;height:72px;border:1px solid #ddd;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;color:#aaa;overflow:hidden;flex-shrink:0}
.img-preview img{width:100%;height:100%;object-fit:contain}
.order-card{border:1px solid #e0e0e0;border-radius:6px;margin-bottom:10px;overflow:hidden}
.order-header{background:#f5f5f5;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.order-body{padding:12px 14px;display:none;font-size:13px}
.order-body.open{display:block}
.order-items th{background:#eee;padding:5px 8px;font-size:12px}
.order-items td{padding:5px 8px;border-bottom:1px solid #f0f0f0}
</style>
</head>
<body>

<div class="header">
  <img src="data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoH" alt="PNA" onerror="this.style.display='none'">
  <h1>Admin Panel</h1>
  <a href="index.html" style="color:#e63329;text-decoration:none;font-size:13px">↗ View Portal</a>
</div>

<div class="tabs">
  <div class="tab active" id="tab-products" onclick="switchTab('products')">🛍 Products</div>
  <div class="tab" id="tab-orders" onclick="switchTab('orders')">📋 Orders</div>
</div>

<!-- PRODUCTS TAB -->
<div class="container" id="panel-products">

  <div class="card">
    <h2>+ Add / Edit Product</h2>
    <input type="hidden" id="p-id">
    <div class="form-row">
      <input type="text" id="p-code" placeholder="Product code *">
      <input type="text" id="p-name" placeholder="Description *">
      <select id="p-cat">
        <option value="">— Select Category —</option>
        <option>Chip Board</option><option>Craft</option><option>Heritage Paint</option>
        <option>Inspo</option><option>Lever Arch</option><option>Mont Marte</option>
        <option>Paper</option><option>Spray Paint</option>
        <option value="__new__">+ Add new category…</option>
      </select>
    </div>
    <div class="form-row">
      <input type="number" id="p-price" placeholder="Sell price (excl VAT)" step="0.01">
      <input type="number" id="p-rrp" placeholder="RRP (incl VAT)" step="0.01">
      <input type="text" id="p-desc" placeholder="Description (optional)">
    </div>

    <!-- Image upload -->
    <div class="img-upload-box">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px">📷 Product Image</div>
      <div class="img-preview-wrap">
        <div class="img-preview" id="form-img-preview">No img</div>
        <div>
          <button class="btn btn-blue btn-sm" onclick="document.getElementById('form-img-input').click()">📷 Choose Image</button>
          <button class="btn btn-sm" style="background:#ddd;color:#555;margin-left:6px" onclick="clearFormImage()">✕ Remove</button>
          <div style="font-size:11px;color:#888;margin-top:6px">Image uploads automatically when you save</div>
        </div>
      </div>
      <input type="hidden" id="p-image-url">
      <input type="file" id="form-img-input" accept="image/*" style="display:none" onchange="previewFormImage(this)">
    </div>

    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-red" onclick="saveProduct()">💾 Save Product</button>
      <button class="btn btn-dark" onclick="clearForm()">✕ Clear</button>
      <span id="form-status" class="sb"></span>
    </div>
  </div>

  <div class="card">
    <h2>📦 Product List</h2>
    <div class="toolbar">
      <input type="text" id="prod-search" placeholder="Search by name or code…" oninput="renderProducts()">
      <select id="prod-cat-filter" onchange="renderProducts()"><option value="">All Categories</option></select>
      <button class="btn btn-dark btn-sm" onclick="loadProducts()">🔄 Refresh</button>
    </div>
    <div id="list-status" class="sb"></div>
    <div id="prod-count" style="font-size:12px;color:#888;margin-bottom:6px"></div>
    <div style="overflow-x:auto">
      <table id="prod-table" style="display:none">
        <thead><tr>
          <th class="img-cell">Image</th>
          <th>Code</th><th>Description</th><th>Category</th>
          <th>Sell Price</th><th>RRP</th><th>Actions</th>
        </tr></thead>
        <tbody id="prod-tbody"></tbody>
      </table>
    </div>
    <div id="prod-empty" style="display:none;text-align:center;padding:30px;color:#aaa;font-size:13px">No products found.</div>
  </div>
</div>

<!-- ORDERS TAB -->
<div class="container" id="panel-orders" style="display:none">
  <div class="card">
    <h2>📋 Orders</h2>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn btn-dark btn-sm" onclick="loadOrders()">🔄 Refresh</button>
      <button class="btn btn-del btn-sm" onclick="clearOrders()">🗑 Clear All Orders</button>
    </div>
    <div id="orders-status" class="sb"></div>
    <div id="orders-container"></div>
  </div>
</div>

<!-- Image zoom modal -->
<div id="img-modal" class="modal-overlay" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal-box">
    <img id="img-modal-src" src="" style="max-width:100%;max-height:300px;object-fit:contain;border-radius:4px">
    <div id="img-modal-name" style="margin-top:10px;font-weight:bold;font-size:14px"></div>
    <button class="btn btn-dark btn-sm" style="margin-top:12px" onclick="document.getElementById('img-modal').classList.remove('show')">✕ Close</button>
  </div>
</div>

<!-- Hidden file input for row quick-upload -->
<input type="file" id="row-img-input" accept="image/*" style="display:none">

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxzBP6y4-JIud-5nPZXbhCjrrhhNEZ_ocYNxlO6n0LIGi0C2Y1zR93KK7xoegLK6MB7/exec';
let allProducts = [];
let formImageFile = null;

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  ['products','orders'].forEach(t => {
    document.getElementById('panel-'+t).style.display = t===tab ? 'block' : 'none';
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  if (tab === 'orders') loadOrders();
}

// ── STATUS ────────────────────────────────────────────────────────────────────
function setStatus(id, type, msg) {
  const el = document.getElementById(id);
  el.className = 'sb ' + type;
  el.textContent = msg;
  if (type === 'ok') setTimeout(() => { el.textContent = ''; }, 5000);
}

// ── LOAD PRODUCTS FROM GOOGLE SHEET (always live) ────────────────────────────
async function loadProducts() {
  setStatus('list-status','ok','⏳ Loading…');
  try {
    const res = await fetch(SCRIPT_URL + '?action=getProducts&t=' + Date.now());
    const data = await res.json();
    if (!data.products) throw new Error('No products returned');
    allProducts = data.products.map(p => ({
      id: String(p.id || '').trim(),
      code: String(p.code || '').replace(/\.0$/, '').trim(),
      name: String(p.name || '').trim(),
      category: String(p.category || '').trim(),
      price: Number(p.price) || 0,
      rrp: Number(p.rrp) || 0,
      description: String(p.description || '').trim(),
      image: String(p.image || '').trim()
    })).filter(p => p.id && p.name);
    rebuildCatFilter();
    renderProducts();
    setStatus('list-status','ok','✅ ' + allProducts.length + ' products loaded');
  } catch(e) {
    setStatus('list-status','err','❌ Could not load products: ' + e.message);
  }
}

function rebuildCatFilter() {
  const cats = [...new Set(allProducts.map(p => p.category))].sort();
  const sel = document.getElementById('prod-cat-filter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All Categories</option>';
  cats.forEach(c => sel.add(new Option(c, c)));
  if (cur) sel.value = cur;
  // Add any missing cats to the form select
  const fsel = document.getElementById('p-cat');
  cats.forEach(c => {
    if (![...fsel.options].find(o => o.value === c)) {
      fsel.add(new Option(c, c), fsel.options.length - 1);
    }
  });
}

function renderProducts() {
  const search = document.getElementById('prod-search').value.toLowerCase();
  const cat = document.getElementById('prod-cat-filter').value;
  const list = allProducts.filter(p => {
    if (cat && p.category !== cat) return false;
    if (search && !p.name.toLowerCase().includes(search) && !String(p.code).includes(search)) return false;
    return true;
  });
  document.getElementById('prod-count').textContent = `Showing ${list.length} of ${allProducts.length} products`;
  document.getElementById('prod-table').style.display = list.length ? 'table' : 'none';
  document.getElementById('prod-empty').style.display = list.length ? 'none' : 'block';
  document.getElementById('prod-tbody').innerHTML = list.map(p => {
    const imgCell = p.image
      ? `<td class="img-cell"><img src="${p.image}" onclick="showImg('${p.image}','${p.name.replace(/'/g,"\\'")}')"></td>`
      : `<td class="img-cell"><span class="no-img">No img</span></td>`;
    return `<tr>${imgCell}
      <td>${p.code}</td><td>${p.name}</td><td>${p.category}</td>
      <td class="price">R ${Number(p.price).toFixed(2)}</td>
      <td>R ${Number(p.rrp).toFixed(2)}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-dark btn-sm" onclick='editProduct(${JSON.stringify(p)})'>✏️ Edit</button>
        <button class="btn btn-blue btn-sm" onclick="quickUpload('${p.id}','${p.code}')">📷</button>
        <button class="btn btn-del btn-sm" onclick="deleteProduct('${p.id}','${p.name.replace(/'/g,"\\'")}')">🗑</button>
      </td>
    </tr>`;
  }).join('');
}

// ── EDIT ──────────────────────────────────────────────────────────────────────
function editProduct(p) {
  document.getElementById('p-id').value = p.id;
  document.getElementById('p-code').value = p.code;
  document.getElementById('p-name').value = p.name;
  document.getElementById('p-price').value = p.price;
  document.getElementById('p-rrp').value = p.rrp;
  document.getElementById('p-desc').value = p.description || '';
  document.getElementById('p-image-url').value = p.image || '';
  const sel = document.getElementById('p-cat');
  if (![...sel.options].find(o => o.value === p.category)) {
    sel.add(new Option(p.category, p.category), sel.options.length - 1);
  }
  sel.value = p.category;
  const prev = document.getElementById('form-img-preview');
  prev.innerHTML = p.image ? `<img src="${p.image}">` : 'No img';
  formImageFile = null;
  document.getElementById('form-img-input').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── FORM IMAGE ────────────────────────────────────────────────────────────────
function previewFormImage(input) {
  const file = input.files[0];
  if (!file) return;
  formImageFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('form-img-preview').innerHTML = `<img src="${e.target.result}">`;
  };
  reader.readAsDataURL(file);
}

function clearFormImage() {
  formImageFile = null;
  document.getElementById('form-img-input').value = '';
  document.getElementById('form-img-preview').textContent = 'No img';
  document.getElementById('p-image-url').value = '';
}

// ── SAVE PRODUCT ──────────────────────────────────────────────────────────────
async function saveProduct() {
  const code = document.getElementById('p-code').value.trim();
  const name = document.getElementById('p-name').value.trim();
  const cat  = document.getElementById('p-cat').value;
  if (!code || !name || !cat || cat === '__new__') {
    setStatus('form-status','err','❌ Code, description and category are required');
    return;
  }
  const id    = document.getElementById('p-id').value || (cat.substring(0,3).toUpperCase() + '-' + code);
  const price = parseFloat(document.getElementById('p-price').value) || 0;
  const rrp   = parseFloat(document.getElementById('p-rrp').value) || 0;
  const desc  = document.getElementById('p-desc').value.trim();
  let imageUrl = document.getElementById('p-image-url').value;

  // STEP 1 — Save the product first (always works, same as before)
  setStatus('form-status','ok','⏳ Saving…');
  const product = { id, code, name, category:cat, price, rrp, description:desc, image:imageUrl };
  try {
    await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'saveProduct', product }) });
    const idx = allProducts.findIndex(p => p.id === id);
    if (idx >= 0) allProducts[idx] = product; else allProducts.push(product);
    renderProducts(); rebuildCatFilter();
    setStatus('form-status','ok','✅ Product saved!');
  } catch(e) {
    setStatus('form-status','err','❌ Save failed: ' + e.message);
    return;
  }

  // STEP 2 — Upload image separately (optional, won't block the save)
  if (formImageFile) {
    setStatus('form-status','ok','⏳ Uploading image…');
    try {
      const base64 = await fileToBase64(formImageFile);
      const ext = formImageFile.name.split('.').pop();
      const resp = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({
        action:'uploadImage', productId:id, productCode:code,
        fileName: code + '.' + ext, mimeType: formImageFile.type, base64Data: base64
      })});
      const result = await resp.json();
      if (result.error) throw new Error(result.error);
      const lh3Url = 'https://lh3.googleusercontent.com/d/' + result.fileId;
      // Update image URL in sheet
      const pidx = allProducts.findIndex(p => p.id === id);
      if (pidx >= 0) allProducts[pidx].image = lh3Url;
      renderProducts();
      setStatus('form-status','ok','✅ Product saved with image!');
    } catch(e) {
      setStatus('form-status','err','⚠️ Product saved but image failed: ' + e.message);
    }
  }

  clearForm();
}

function clearForm() {
  ['p-id','p-code','p-name','p-price','p-rrp','p-desc','p-image-url'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('p-cat').value = '';
  document.getElementById('form-img-preview').textContent = 'No img';
  document.getElementById('form-img-input').value = '';
  formImageFile = null;
  setStatus('form-status','','');
}

// ── DELETE ────────────────────────────────────────────────────────────────────
async function deleteProduct(id, name) {
  if (!confirm('Delete "' + name + '"?')) return;
  try {
    await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'deleteProduct', id }) });
    allProducts = allProducts.filter(p => p.id !== id);
    renderProducts();
    setStatus('list-status','ok','✅ Deleted');
  } catch(e) {
    setStatus('list-status','err','❌ Delete failed');
  }
}

// ── QUICK UPLOAD (📷 button in product row) ───────────────────────────────────
function quickUpload(productId, productCode) {
  const inp = document.getElementById('row-img-input');
  inp.value = '';
  inp.onchange = async function() {
    const file = inp.files[0];
    if (!file) return;
    setStatus('list-status','ok','⏳ Uploading image…');
    try {
      const base64 = await fileToBase64(file);
      const ext = file.name.split('.').pop();
      const resp = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({
        action:'uploadImage', productId, productCode,
        fileName: productCode + '.' + ext, mimeType: file.type, base64Data: base64
      })});
      const result = await resp.json();
      if (result.error) throw new Error(result.error);
      const lh3Url = 'https://lh3.googleusercontent.com/d/' + result.fileId;
      const idx = allProducts.findIndex(p => p.id === productId);
      if (idx >= 0) allProducts[idx].image = lh3Url;
      renderProducts();
      setStatus('list-status','ok','✅ Image saved to Google Sheet!');
    } catch(e) {
      setStatus('list-status','err','❌ Upload failed: ' + e.message);
    }
  };
  inp.click();
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function showImg(url, name) {
  document.getElementById('img-modal-src').src = url;
  document.getElementById('img-modal-name').textContent = name;
  document.getElementById('img-modal').classList.add('show');
}
document.addEventListener('keydown', e => { if (e.key==='Escape') document.getElementById('img-modal').classList.remove('show'); });

document.getElementById('p-cat').addEventListener('change', function() {
  if (this.value === '__new__') {
    const newCat = prompt('Enter new category name:');
    if (newCat && newCat.trim()) {
      const opt = new Option(newCat.trim(), newCat.trim());
      this.add(opt, this.options.length - 1);
      this.value = newCat.trim();
    } else { this.value = ''; }
  }
});

// ── ORDERS ────────────────────────────────────────────────────────────────────
async function loadOrders() {
  setStatus('orders-status','ok','⏳ Loading orders…');
  const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSvWtGcth4tLAFLEe4Tg-v7N6xd9EAoH9kfk9OMeNUmcJAyfEGo363dq9SWTe4bsScCac0D2mYtifYv/pub?gid=0&single=true&output=csv';
  try {
    const resp = await fetch(csvUrl + '&t=' + Date.now());
    const text = await resp.text();
    const rows = text.trim().split('\n').slice(1).map(r => parseCSV(r));
    if (!rows.length || !rows[0][0]) {
      document.getElementById('orders-container').innerHTML = '<p style="color:#aaa;font-size:13px;text-align:center;padding:20px">No orders yet.</p>';
      setStatus('orders-status','ok','');
      return;
    }
    const map = {};
    rows.forEach(r => {
      const [ref,franchise,date,category,code,name,qty,rrp,sell,notes] = r;
      if (!ref) return;
      if (!map[ref]) map[ref] = { ref, franchise, date, notes: notes||'', items:[] };
      map[ref].items.push({ category, code, name, qty:Number(qty), rrp:Number(rrp), sell:Number(sell)||0 });
    });
    const orders = Object.values(map).sort((a,b) => b.date.localeCompare(a.date));
    document.getElementById('orders-container').innerHTML = orders.map(o => orderCard(o)).join('');
    setStatus('orders-status','ok','✅ ' + orders.length + ' orders');
  } catch(e) {
    setStatus('orders-status','err','❌ Could not load orders');
  }
}

function parseCSV(row) {
  const result = []; let cur = ''; let inQ = false;
  for (const c of row) {
    if (c==='"') { inQ=!inQ; continue; }
    if (c===',' && !inQ) { result.push(cur.trim()); cur=''; continue; }
    cur += c;
  }
  result.push(cur.trim());
  return result;
}

const orderMap = {};

function orderCard(o) {
  orderMap[o.ref] = o;
  const total = o.items.reduce((s,i) => s + i.qty * i.rrp, 0);
  const sellTotal = o.items.reduce((s,i) => s + i.qty * (i.sell || 0), 0);
  return `<div class="order-card">
    <div class="order-header" onclick="this.nextElementSibling.classList.toggle('open')">
      <span><strong>${o.ref}</strong> · ${o.franchise} · ${o.date}</span>
      <span>RRP: R ${total.toFixed(2)} ${o.notes?'📝':''} ▾</span>
    </div>
    <div class="order-body">
      ${o.notes ? `<div style="margin-bottom:8px;font-style:italic;color:#555">📝 ${o.notes}</div>` : ''}
      <table class="order-items" style="width:100%;border-collapse:collapse;margin-bottom:8px">
        <tr><th>Code</th><th>Description</th><th>Category</th><th>Qty</th></tr>
        ${o.items.map(i=>`<tr>
          <td>${i.code}</td><td>${i.name}</td><td>${i.category}</td><td>${i.qty}</td>
        </tr>`).join('')}
      </table>
      <button class="btn btn-dark btn-sm" onclick="pickingSlip('${o.ref}')">🖨 Picking Slip</button>
    </div>
  </div>`;
}

async function clearOrders() {
  if (!confirm('Clear ALL orders? This cannot be undone.')) return;
  await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'clearOrders' }) });
  document.getElementById('orders-container').innerHTML = '<p style="color:#aaa;font-size:13px;text-align:center;padding:20px">No orders yet.</p>';
  setStatus('orders-status','ok','✅ All orders cleared');
}

function pickingSlip(ref) {

  const categories = [...new Set(sorted.map(i => i.category))];
  const sellTotal = sorted.reduce((s,i) => s + i.qty * (i.sell||0), 0);
  const totalUnits = sorted.reduce((s,i) => s + i.qty, 0);

  // Build rows grouped by category
  let rows = '';

    rows += `<tr><td colspan="5" style="background:#2c2c2c;color:#fff;font-weight:bold;font-size:12px;text-transform:uppercase;letter-spacing:1px;padding:7px 10px">📦 ${cat}</td></tr>`;

      rowNum++;

        <td style="text-align:center;color:#888;font-size:11px">${rowNum}</td>
        <td style="font-weight:bold;font-size:12px;color:#333">${i.code}</td>

          &nbsp;
          <span style="display:inline-block;width:20px;height:20px;border:2px solid #555;border-radius:3px">&nbsp;</span>

  <div class="slip-footer">PNA JHB Franchise Ordering Portal &nbsp;|&nbsp; Order ${o.ref} &nbsp;|&nbsp; Generated ${new Date().toLocaleString('en-ZA')}</div>
