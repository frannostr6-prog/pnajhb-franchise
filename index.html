<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNA JHB — Franchise Orders</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f3ef;--card:#fff;--border:#e2ddd6;--text:#1a1714;--muted:#7a756e;
  --accent:#c8402a;--accent-light:#fdf0ed;--accent-dark:#9e3220;
  --green:#2a7a4b;--green-light:#edf7f2;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
header{background:var(--text);color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;}
.logo{font-size:15px;font-weight:600;letter-spacing:.04em;}.logo span{color:var(--accent);}
.submit-header-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.submit-header-btn:disabled{opacity:.4;cursor:default;}
.fname-bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;}
.fname-bar label{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;}
.fname-bar input{flex:1;max-width:280px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;}
.fname-bar input:focus{border-color:var(--accent);}
.controls{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.search-wrap{position:relative;flex:1;min-width:160px;}
.search-wrap input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;}
.search-wrap input:focus{border-color:var(--accent);}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none;}
select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;cursor:pointer;}
select:focus{border-color:var(--accent);}
.clear-btn{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;}
.clear-btn:hover{color:var(--accent);border-color:var(--accent);}
.results-bar{padding:7px 16px;font-size:12px;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.order-summary-bar{font-size:12px;font-weight:500;color:var(--green);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--card);position:sticky;top:52px;z-index:50;}
th{padding:9px 12px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
th:hover{color:var(--text);}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:#faf9f7;}
tr.has-qty td{background:#f0faf4;}
tr.has-qty:hover td{background:#e8f7ee;}
.col-code{font-family:"DM Mono",monospace;font-size:12px;color:var(--muted);white-space:nowrap;}
.col-name{font-weight:500;min-width:180px;}
.col-price{font-family:"DM Mono",monospace;font-weight:600;color:var(--accent);white-space:nowrap;}
.col-rrp{font-family:"DM Mono",monospace;color:var(--muted);white-space:nowrap;}
.col-qty{width:90px;}
.col-img{width:40px;}
.product-thumb{width:36px;height:36px;object-fit:cover;border-radius:6px;background:var(--bg);display:block;border:1px solid var(--border);}
.product-thumb-ph{width:36px;height:36px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid var(--border);}
.qty-input{width:72px;padding:7px 8px;border:1px solid var(--border);border-radius:7px;font-size:14px;font-family:"DM Mono",monospace;text-align:center;background:var(--bg);outline:none;color:var(--text);}
.qty-input:focus{border-color:var(--accent);background:#fff;}
.qty-input.has-val{border-color:var(--green);background:var(--green-light);font-weight:600;color:var(--green);}
.empty-row td{text-align:center;padding:48px;color:var(--muted);}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
@media(min-width:600px){.overlay{align-items:center;}}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:20px;}
@media(min-width:600px){.modal{border-radius:16px;}}
.modal-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);}
.modal-h{font-size:17px;font-weight:600;margin-bottom:14px;}
.order-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:8px;}
.order-line:last-of-type{border-bottom:none;}
.order-line-name{font-weight:500;}
.order-line-sub{font-size:11px;color:var(--muted);font-family:"DM Mono",monospace;}
.order-line-price{font-family:"DM Mono",monospace;font-weight:600;color:var(--accent);white-space:nowrap;margin-left:8px;}
.order-total{display:flex;justify-content:space-between;padding:13px 0 4px;font-size:15px;font-weight:600;border-top:2px solid var(--text);margin-top:8px;}
.order-note{font-size:11px;color:var(--muted);margin-top:4px;margin-bottom:16px;}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;}
.action-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;}
.btn{padding:12px 10px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-green{background:var(--green);color:#fff;}.btn-green:hover{opacity:.9;}
.btn-email{background:#1a73e8;color:#fff;}.btn-email:hover{opacity:.9;}
.btn-csv{background:var(--bg);color:var(--text);border:1px solid var(--border);}.btn-csv:hover{border-color:var(--text);}
.btn-whatsapp{background:#25D366;color:#fff;}.btn-whatsapp:hover{opacity:.9;}
.btn-confirm{background:var(--green);color:#fff;grid-column:1/-1;}.btn-confirm:hover{opacity:.9;}
.success-box{background:var(--green-light);color:var(--green);border-radius:10px;padding:16px;text-align:center;font-size:14px;font-weight:500;display:none;margin-top:12px;}
</style>
</head>
<body>
<header>
  <div class="logo">PNA<span>JHB</span> Orders</div>
  <button class="submit-header-btn" id="submit-btn" disabled onclick="openSubmit()">Submit order</button>
</header>
<div class="fname-bar">
  <label>Franchise</label>
  <input type="text" id="fname" placeholder="Enter your franchise name"/>
</div>
<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search by name or code..." oninput="render()">
  </div>
  <select id="sort" onchange="render()">
    <option value="name-asc">Name A–Z</option>
    <option value="name-desc">Name Z–A</option>
    <option value="code-asc">Code ↑</option>
    <option value="code-desc">Code ↓</option>
    <option value="price-asc">Price ↑</option>
    <option value="price-desc">Price ↓</option>
  </select>
  <button class="clear-btn" onclick="clearAll()">Clear all qty</button>
</div>
<div class="results-bar">
  <span id="results-count">125 products</span>
  <span class="order-summary-bar" id="order-summary"></span>
</div>
<div class="tbl-wrap">
  <table>
    <thead>
      <tr>
        <th class="col-img"></th>
        <th>Code</th>
        <th>Description</th>
        <th>Sell price</th>
        <th>RRP</th>
        <th class="col-qty">Qty</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-h">Review order</div>
    <div id="modal-body"></div>
    <hr class="divider"/>
    <div class="section-label">Send or export</div>
    <div class="action-btns">
      <button class="btn btn-email" onclick="sendEmail()">📧 Email</button>
      <button class="btn btn-whatsapp" onclick="sendWhatsApp()">💬 WhatsApp</button>
      <button class="btn btn-csv" onclick="downloadCSV()">⬇ CSV</button>
      <button class="btn btn-confirm" onclick="confirmOrder()" id="confirm-btn">✓ Confirm &amp; save order</button>
    </div>
    <div class="success-box" id="success-box">✅ Order saved! Use the buttons above to send it.</div>
  </div>
</div>

const ORDER_EMAIL = 'franno@pnajhb.co.za;franchise@pnajhb.co.za';
const qtys = {};

function render(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const sort=document.getElementById('sort').value;
  let list=q?PRODUCTS.filter(p=>p.name.toLowerCase().includes(q)||p.code.includes(q)):[...PRODUCTS];
  list.sort((a,b)=>{
    if(sort==='name-asc') return a.name.localeCompare(b.name);
    if(sort==='name-desc') return b.name.localeCompare(a.name);
    if(sort==='code-asc') return a.code.localeCompare(b.code);
    if(sort==='code-desc') return b.code.localeCompare(a.code);
    if(sort==='price-asc') return a.price-b.price;
    if(sort==='price-desc') return b.price-a.price;
    return 0;
  });
  document.getElementById('results-count').textContent=list.length+' products';
  updateSummary();
  const tbody=document.getElementById('tbody');
  if(!list.length){tbody.innerHTML='<tr class="empty-row"><td colspan="6">No products found.</td></tr>';return;}
  tbody.innerHTML=list.map(p=>{
    const qty=qtys[p.id]||0;
    return `<tr class="${qty>0?'has-qty':''}" id="row-${p.id}">
      <td class="col-img">${p.image?`<img class="product-thumb" src="${p.image}" alt="${p.name}" onerror="this.outerHTML='<div class=product-thumb-ph>📦</div>'"/>`:'<div class="product-thumb-ph">📦</div>'}</td>
      <td class="col-code">${p.code}</td>
      <td class="col-name">${p.name}</td>
      <td class="col-price">R${p.price.toFixed(2)}</td>
      <td class="col-rrp">R${p.rrp.toFixed(2)}</td>
      <td class="col-qty"><input class="qty-input${qty>0?' has-val':''}" type="number" min="0" value="${qty||''}" placeholder="0" data-id="${p.id}" oninput="setQty(this)"/></td>
    </tr>`;
  }).join('');
}

function setQty(input){
  const id=input.getAttribute('data-id');
  const val=parseInt(input.value)||0;
  if(val>0){qtys[id]=val;input.classList.add('has-val');}
  else{delete qtys[id];input.classList.remove('has-val');input.value='';}
  const row=document.getElementById('row-'+id);
  if(row){if(val>0)row.classList.add('has-qty');else row.classList.remove('has-qty');}
  updateSummary();
}

function updateSummary(){
  const ids=Object.keys(qtys);
  const btn=document.getElementById('submit-btn');
  const el=document.getElementById('order-summary');
  if(!ids.length){el.textContent='';btn.disabled=true;return;}
  const totalQty=ids.reduce((s,id)=>s+qtys[id],0);
  const totalVal=ids.reduce((s,id)=>{const p=PRODUCTS.find(x=>x.id===id);return s+(p?p.price*qtys[id]:0);},0);
  el.textContent=`${ids.length} item${ids.length!==1?'s':''} · ${totalQty} units · R${totalVal.toFixed(2)}`;
  btn.disabled=false;
}

function clearAll(){Object.keys(qtys).forEach(k=>delete qtys[k]);render();}

function getOrderLines(){
  return Object.keys(qtys).map(id=>{
    const p=PRODUCTS.find(x=>x.id===id);
    return {...p,qty:qtys[id],subtotal:p.price*qtys[id]};
  }).sort((a,b)=>a.name.localeCompare(b.name));
}

function openSubmit(){
  const fname=document.getElementById('fname').value.trim();
  if(!fname){alert('Please enter your franchise name first.');document.getElementById('fname').focus();return;}
  if(!Object.keys(qtys).length){alert('Please enter quantities for at least one product.');return;}
  const lines=getOrderLines();
  const total=lines.reduce((s,l)=>s+l.subtotal,0);
  document.getElementById('modal-body').innerHTML=`
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Franchise: <strong style="color:var(--text)">${fname}</strong> &nbsp;·&nbsp; ${new Date().toLocaleDateString('en-ZA')}</p>
    ${lines.map(l=>`<div class="order-line">
      <div><div class="order-line-name">${l.name}</div><div class="order-line-sub">${l.code} · Qty ${l.qty} × R${l.price.toFixed(2)}</div></div>
      <div class="order-line-price">R${l.subtotal.toFixed(2)}</div>
    </div>`).join('')}
    <div class="order-total"><span>Total (excl VAT)</span><span>R${total.toFixed(2)}</span></div>
    <p class="order-note">* Prices are indicative. Final invoice may differ.</p>`;
  document.getElementById('success-box').style.display='none';
  document.getElementById('confirm-btn').style.display='flex';
  document.getElementById('modal').classList.add('open');
}

function sendEmail(){
  const fname=document.getElementById('fname').value.trim();
  const lines=getOrderLines();
  const total=lines.reduce((s,l)=>s+l.subtotal,0);
  const date=new Date().toLocaleDateString('en-ZA');
  const subject=encodeURIComponent(`Order - ${fname} - ${date}`);
  const body=encodeURIComponent(
    `ORDER FROM: ${fname}\nDATE: ${date}\n\n`+
    lines.map(l=>`${l.code}  ${l.name}\n  Qty: ${l.qty}  x  R${l.price.toFixed(2)}  =  R${l.subtotal.toFixed(2)}`).join('\n\n')+
    `\n\n----------------------------------------\nTOTAL (excl VAT): R${total.toFixed(2)}\n\n* Prices indicative. Final invoice may differ.`
  );
  window.location.href=`mailto:${ORDER_EMAIL}?subject=${subject}&body=${body}`;
}

function sendWhatsApp(){
  const fname=document.getElementById('fname').value.trim();
  const lines=getOrderLines();
  const total=lines.reduce((s,l)=>s+l.subtotal,0);
  const date=new Date().toLocaleDateString('en-ZA');
  const text=encodeURIComponent(
    `*ORDER - ${fname}*\n${date}\n\n`+
    lines.map(l=>`• ${l.code} ${l.name}\n  Qty: ${l.qty} × R${l.price.toFixed(2)} = *R${l.subtotal.toFixed(2)}*`).join('\n\n')+
    `\n\n*Total (excl VAT): R${total.toFixed(2)}*\n_Prices indicative. Final invoice may differ._`
  );
  window.open(`https://wa.me/?text=${text}`,'_blank');
}

function downloadCSV(){
  const fname=document.getElementById('fname').value.trim();
  const lines=getOrderLines();
  const total=lines.reduce((s,l)=>s+l.subtotal,0);
  const date=new Date().toLocaleDateString('en-ZA');
  let csv=`Franchise,${fname}\nDate,${date}\n\nCode,Description,Qty,Sell Price (excl VAT),RRP (incl VAT),Subtotal\n`;
  csv+=lines.map(l=>`${l.code},"${l.name}",${l.qty},${l.price.toFixed(2)},${l.rrp.toFixed(2)},${l.subtotal.toFixed(2)}`).join('\n');
  csv+=`\n\nTotal (excl VAT),,,,,${total.toFixed(2)}`;
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`Order_${fname.replace(/\s+/g,'_')}_${date.replace(/\//g,'-')}.csv`;
  a.click();
}

function confirmOrder(){
  const fname=document.getElementById('fname').value.trim();
  const lines=getOrderLines();
  const total=lines.reduce((s,l)=>s+l.subtotal,0);
  const saved=JSON.parse(localStorage.getItem('pna_orders')||'[]');
  saved.push({
    id: Date.now().toString(),
    franchiseName:fname,
    date:new Date().toLocaleString('en-ZA'),
    items:lines.map(l=>({code:l.code,name:l.name,qty:l.qty,price:l.price,subtotal:l.subtotal})),
    total:total.toFixed(2)
  });
  localStorage.setItem('pna_orders',JSON.stringify(saved));
  document.getElementById('success-box').style.display='block';
  document.getElementById('confirm-btn').style.display='none';
  clearAll();
}

function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
render();
</script>
