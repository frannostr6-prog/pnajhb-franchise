<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNA JHB — Franchise Orders</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ef; --card: #ffffff; --border: #e2ddd6;
    --text: #1a1714; --muted: #7a756e; --accent: #c8402a;
    --accent-light: #fdf0ed; --accent-dark: #9e3220;
    --green: #2a7a4b; --green-light: #edf7f2;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "DM Sans", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--text); color: #fff; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
  .logo span { color: var(--accent); }
  .cart-btn { display: flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .cart-count { background: #fff; color: var(--accent); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .controls { padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .search-wrap { flex: 1; min-width: 180px; position: relative; }
  .search-wrap input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); outline: none; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
  select { padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; background: var(--bg); color: var(--text); outline: none; cursor: pointer; }
  .filter-btn { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; background: var(--bg); color: var(--text); cursor: pointer; white-space: nowrap; }
  .filter-btn.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); font-weight: 500; }
  .results-count { font-size: 12px; color: var(--muted); padding: 6px 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; padding: 10px 16px 24px; }
  @media(min-width:600px){ .grid { grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap:12px; } }
  .product-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform 0.15s; }
  .product-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .product-img { width: 100%; aspect-ratio: 1; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .product-img img { width: 100%; height: 100%; object-fit: cover; }
  .product-img-icon { font-size: 36px; color: var(--border); }
  .product-info { padding: 10px 11px 12px; }
  .product-code { font-size: 10px; color: var(--muted); font-family: "DM Mono", monospace; margin-bottom: 3px; }
  .product-name { font-size: 12px; font-weight: 500; line-height: 1.35; margin-bottom: 6px; }
  .price-row { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .product-price { font-size: 13px; font-weight: 600; color: var(--accent); font-family: "DM Mono", monospace; }
  .product-rrp { font-size: 10px; color: var(--muted); font-family: "DM Mono", monospace; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); grid-column: 1/-1; }

  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  @media(min-width:600px){ .overlay { align-items: center; } }
  .modal { background: var(--card); border-radius: 16px 16px 0 0; width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; padding: 20px; }
  @media(min-width:600px){ .modal { border-radius: 16px; } }
  .modal-close { float: right; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); }
  .modal-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; margin: 10px 0 14px; background: var(--bg); display:flex; align-items:center; justify-content:center; font-size:60px; color:var(--border); }
  .modal-img img { width:100%; height:100%; object-fit:cover; border-radius:10px; }
  .modal-code { font-size: 11px; color: var(--muted); font-family: "DM Mono", monospace; margin-bottom: 4px; }
  .modal-name { font-size: 19px; font-weight: 600; margin-bottom: 10px; line-height: 1.3; }
  .modal-prices { display: flex; gap: 16px; align-items: baseline; margin-bottom: 18px; }
  .modal-sell { font-size: 20px; font-weight: 600; color: var(--accent); font-family: "DM Mono", monospace; }
  .modal-rrp-label { font-size: 12px; color: var(--muted); }
  .modal-rrp-val { font-size: 14px; font-weight: 500; font-family: "DM Mono", monospace; color: var(--text); }
  .qty-label { font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .qty-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .qty-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-num { font-size: 20px; font-weight: 600; min-width: 28px; text-align: center; }
  .modal-subtotal { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .modal-subtotal strong { color: var(--text); }
  .add-btn { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .add-btn:hover { background: var(--accent-dark); }

  /* Cart */
  .cart-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px; gap: 8px; }
  .cart-item:last-of-type { border-bottom: none; }
  .cart-item-name { font-weight: 500; font-size: 13px; }
  .cart-item-sub { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: "DM Mono", monospace; }
  .cart-item-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .cart-price { font-weight: 600; font-family: "DM Mono", monospace; color: var(--accent); font-size: 13px; }
  .rm-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px; }
  .cart-total-row { display: flex; justify-content: space-between; padding: 14px 0 0; font-size: 16px; font-weight: 600; border-top: 2px solid var(--text); margin-top: 6px; }
  .cart-empty { text-align: center; padding: 28px; color: var(--muted); font-size: 14px; }
  .name-field { margin-bottom: 14px; }
  .name-field label { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 5px; }
  .name-field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; }
  .name-field input:focus { border-color: var(--accent); }
  .submit-btn { width: 100%; padding: 13px; background: var(--green); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 10px; }
  .submit-btn:disabled { opacity: 0.5; cursor: default; }
  .success-box { background: var(--green-light); color: var(--green); border-radius: 10px; padding: 14px; text-align: center; font-size: 14px; font-weight: 500; margin-top: 10px; display: none; }
  .modal-h2 { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
</style>
</head>
<body>
<header>
  <div class="logo">PNA<span>JHB</span> Orders</div>
  <button class="cart-btn" onclick="openCart()">🛒 Cart <span class="cart-count" id="cart-count">0</span></button>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search by name or code..." oninput="render()">
  </div>
  <select id="sort" onchange="render()">
    <option value="name-asc">A – Z</option>
    <option value="name-desc">Z – A</option>
    <option value="price-asc">Price ↑</option>
    <option value="price-desc">Price ↓</option>
    <option value="rrp-desc">RRP ↑</option>
  </select>
</div>
<div class="results-count" id="results-count"></div>
<div class="grid" id="grid"></div>

<!-- Product modal -->
<div class="overlay" id="product-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('product-modal')">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Cart modal -->
<div class="overlay" id="cart-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('cart-modal')">✕</button>
    <div class="modal-h2">Your order</div>
    <div class="name-field">
      <label>Franchise name</label>
      <input type="text" id="fname" placeholder="e.g. Cape Town North" />
    </div>
    <div id="cart-items"></div>
    <div id="cart-footer"></div>
    <div id="submit-wrap">
      <button class="submit-btn" onclick="submitOrder()">Submit order</button>
    </div>
    <div class="success-box" id="success-box">✅ Order submitted! We'll be in touch shortly.</div>
  </div>
</div>

let cart = [];
let curProduct = null;
let curQty = 1;

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const sort = document.getElementById('sort').value;
  let list = PRODUCTS.filter(p =>
    p.name.toLowerCase().includes(q) || p.code.includes(q)
  );
  list.sort((a,b) => {
    if(sort==='name-asc') return a.name.localeCompare(b.name);
    if(sort==='name-desc') return b.name.localeCompare(a.name);
    if(sort==='price-asc') return a.price - b.price;
    if(sort==='price-desc') return b.price - a.price;
    if(sort==='rrp-desc') return b.rrp - a.rrp;
  });
  document.getElementById('results-count').textContent = list.length + ' products';
  const grid = document.getElementById('grid');
  if(!list.length){
    grid.innerHTML = '<div class="empty">No products found.</div>';
    return;
  }
  grid.innerHTML = list.map(p => `
    <div class="product-card" onclick="openProduct('${p.id}')">
      <div class="product-img">${p.image ? `<img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='<span class=product-img-icon>📦</span>'"/>` : '<span class="product-img-icon">📦</span>'}</div>
      <div class="product-info">
        <div class="product-code">${p.code}</div>
        <div class="product-name">${p.name}</div>
        <div class="price-row">
          <span class="product-price">R${p.price.toFixed(2)}</span>
          <span class="product-rrp">RRP R${p.rrp.toFixed(2)}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function openProduct(id) {
  curProduct = PRODUCTS.find(p => p.id === id);
  curQty = 1;
  if(!curProduct) return;
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-img">${curProduct.image ? `<img src="${curProduct.image}" alt="${curProduct.name}"/>` : '📦'}</div>
    <div class="modal-code">${curProduct.code}</div>
    <div class="modal-name">${curProduct.name}</div>
    <div class="modal-prices">
      <div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">Sell price (excl VAT)</div><div class="modal-sell">R${curProduct.price.toFixed(2)}</div></div>
      <div><div class="modal-rrp-label">RRP (incl VAT)</div><div class="modal-rrp-val">R${curProduct.rrp.toFixed(2)}</div></div>
    </div>
    <div class="qty-label">Quantity</div>
    <div class="qty-row">
      <button class="qty-btn" onclick="chgQty(-1)">−</button>
      <span class="qty-num" id="mqty">1</span>
      <button class="qty-btn" onclick="chgQty(1)">+</button>
    </div>
    <div class="modal-subtotal">Subtotal: <strong id="msub">R${curProduct.price.toFixed(2)}</strong></div>
    <button class="add-btn" onclick="addToCart()">Add to order</button>
  `;
  document.getElementById('product-modal').classList.add('open');
}

function chgQty(d) {
  curQty = Math.max(1, curQty + d);
  document.getElementById('mqty').textContent = curQty;
  document.getElementById('msub').textContent = 'R' + (curProduct.price * curQty).toFixed(2);
}

function addToCart() {
  const ex = cart.find(i => i.id === curProduct.id);
  if(ex) ex.qty += curQty;
  else cart.push({id: curProduct.id, code: curProduct.code, name: curProduct.name, price: curProduct.price, rrp: curProduct.rrp, qty: curQty});
  updCount();
  closeModal('product-modal');
}

function updCount() {
  document.getElementById('cart-count').textContent = cart.reduce((s,i) => s+i.qty, 0);
}

function openCart() {
  renderCart();
  document.getElementById('success-box').style.display = 'none';
  document.getElementById('submit-wrap').style.display = 'block';
  document.getElementById('cart-modal').classList.add('open');
}

function renderCart() {
  const el = document.getElementById('cart-items');
  const ft = document.getElementById('cart-footer');
  if(!cart.length){ el.innerHTML = '<div class="cart-empty">Your cart is empty.</div>'; ft.innerHTML=''; return; }
  el.innerHTML = cart.map(i => `
    <div class="cart-item">
      <div>
        <div class="cart-item-name">${i.name}</div>
        <div class="cart-item-sub">${i.code} · Qty ${i.qty} × R${i.price.toFixed(2)}</div>
      </div>
      <div class="cart-item-right">
        <span class="cart-price">R${(i.qty*i.price).toFixed(2)}</span>
        <button class="rm-btn" onclick="removeItem('${i.id}')">✕</button>
      </div>
    </div>
  `).join('');
  const total = cart.reduce((s,i) => s + i.qty*i.price, 0);
  ft.innerHTML = `<div class="cart-total-row"><span>Total (excl VAT)</span><span>R${total.toFixed(2)}</span></div>`;
}

function removeItem(id) {
  cart = cart.filter(i => i.id !== id);
  updCount();
  renderCart();
}

function submitOrder() {
  const name = document.getElementById('fname').value.trim();
  if(!name){ alert('Please enter your franchise name.'); return; }
  if(!cart.length){ alert('Cart is empty.'); return; }
  const total = cart.reduce((s,i) => s+i.qty*i.price,0);
  const orderLines = cart.map(i => `${i.code} - ${i.name} x${i.qty} @ R${i.price.toFixed(2)}`).join('\n');
  const saved = JSON.parse(localStorage.getItem('pna_orders')||'[]');
  saved.push({ franchiseName: name, items: cart.map(i=>`${i.code} ${i.name} x${i.qty}`).join(', '), total: total.toFixed(2), date: new Date().toLocaleString('en-ZA'), detail: orderLines });
  localStorage.setItem('pna_orders', JSON.stringify(saved));
  document.getElementById('success-box').style.display = 'block';
  document.getElementById('submit-wrap').style.display = 'none';
  cart = [];
  updCount();
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(el => el.addEventListener('click', e => { if(e.target===el) el.classList.remove('open'); }));
render();
</script>
