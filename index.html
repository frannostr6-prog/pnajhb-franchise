<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNA JHB — Franchise Orders</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --border: #e2ddd6;
    --text: #1a1714;
    --muted: #7a756e;
    --accent: #c8402a;
    --accent-light: #fdf0ed;
    --accent-dark: #9e3220;
    --green: #2a7a4b;
    --green-light: #edf7f2;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Header */
  header { background: var(--text); color: #fff; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
  .logo span { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .cart-btn { display: flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .cart-count { background: #fff; color: var(--accent); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }

  /* Controls */
  .controls { padding: 16px 20px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap input { width: 100%; padding: 9px 12px 9px 36px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); outline: none; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; }
  select { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; background: var(--bg); color: var(--text); outline: none; cursor: pointer; }
  select:focus { border-color: var(--accent); }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 16px 20px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

  /* Product card */
  .product-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .product-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .product-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  .product-img img { width: 100%; height: 100%; object-fit: cover; }
  .product-img-placeholder { width: 100%; aspect-ratio: 1; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--border); font-size: 40px; }
  .product-info { padding: 10px 12px; }
  .product-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; line-height: 1.3; }
  .product-price { font-size: 14px; font-weight: 600; color: var(--accent); font-family: 'DM Mono', monospace; }
  .product-desc { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Empty */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* Modal overlay */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  @media (min-width: 600px) { .modal-overlay { align-items: center; } }
  .modal { background: var(--card); border-radius: 16px 16px 0 0; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 24px 20px; }
  @media (min-width: 600px) { .modal { border-radius: 16px; } }
  .modal-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; margin-bottom: 16px; background: var(--bg); }
  .modal-img-placeholder { width: 100%; aspect-ratio: 4/3; background: var(--bg); border-radius: 10px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; color: var(--border); font-size: 60px; }
  .modal-name { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .modal-price { font-size: 22px; font-weight: 600; color: var(--accent); font-family: 'DM Mono', monospace; margin-bottom: 10px; }
  .modal-desc { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
  .qty-label { font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .qty-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .qty-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); }
  .qty-num { font-size: 20px; font-weight: 600; min-width: 32px; text-align: center; }
  .modal-total { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .modal-total strong { color: var(--text); }
  .add-btn { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .add-btn:hover { background: var(--accent-dark); }
  .close-btn { float: right; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); margin-bottom: 8px; }

  /* Cart modal */
  .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .cart-item:last-of-type { border-bottom: none; }
  .cart-item-name { font-weight: 500; }
  .cart-item-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cart-item-price { font-weight: 600; font-family: 'DM Mono', monospace; color: var(--accent); }
  .remove-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; margin-left: 8px; }
  .cart-total-row { display: flex; justify-content: space-between; padding: 16px 0 0; font-size: 16px; font-weight: 600; border-top: 2px solid var(--text); margin-top: 8px; }
  .cart-empty { text-align: center; padding: 30px; color: var(--muted); }

  /* Franchisee name input */
  .name-field { margin-bottom: 16px; }
  .name-field label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 6px; }
  .name-field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; }
  .name-field input:focus { border-color: var(--accent); }

  .submit-btn { width: 100%; padding: 14px; background: var(--green); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 12px; }
  .submit-btn:hover { opacity: 0.9; }
  .submit-btn:disabled { opacity: 0.5; cursor: default; }

  .success-msg { background: var(--green-light); color: var(--green); border-radius: 10px; padding: 14px; text-align: center; font-size: 14px; font-weight: 500; margin-top: 12px; display: none; }

  .tag { display: inline-block; background: var(--accent-light); color: var(--accent); font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
</style>
</head>
<body>

<header>
  <div class="logo">PNA<span>JHB</span> Orders</div>
  <div class="header-right">
    <button class="cart-btn" onclick="openCart()">
      🛒 Cart <span class="cart-count" id="cart-count">0</span>
    </button>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search products..." oninput="renderProducts()">
  </div>
  <select id="sort" onchange="renderProducts()">
    <option value="name-asc">Name A–Z</option>
    <option value="name-desc">Name Z–A</option>
    <option value="price-asc">Price: Low to High</option>
    <option value="price-desc">Price: High to Low</option>
  </select>
</div>

<div class="grid" id="product-grid"></div>

<!-- Product Detail Modal -->
<div class="modal-overlay" id="product-modal">
  <div class="modal">
    <button class="close-btn" onclick="closeModal('product-modal')">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- Cart Modal -->
<div class="modal-overlay" id="cart-modal">
  <div class="modal">
    <button class="close-btn" onclick="closeModal('cart-modal')">✕</button>
    <h2 style="font-size:18px; font-weight:600; margin-bottom:16px;">Your order</h2>
    <div class="name-field">
      <label>Your franchise name</label>
      <input type="text" id="franchise-name" placeholder="e.g. Cape Town North" />
    </div>
    <div id="cart-items"></div>
    <div id="cart-total-row"></div>
    <button class="submit-btn" id="submit-btn" onclick="submitOrder()">Submit order</button>
    <div class="success-msg" id="success-msg">✅ Order submitted! We'll be in touch shortly.</div>
  </div>
</div>

<script>
// ── CONFIG ── Replace with your Google Apps Script Web App URL after setup
const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL';

// ── PRODUCTS DATA ── Loaded from admin or hardcoded for now
let products = JSON.parse(localStorage.getItem('pna_products') || '[]');
let cart = [];
let currentProduct = null;
let currentQty = 1;

function renderProducts() {
  const search = document.getElementById('search').value.toLowerCase();
  const sort = document.getElementById('sort').value;
  const grid = document.getElementById('product-grid');

  let filtered = products.filter(p =>
    p.name.toLowerCase().includes(search) ||
    (p.description || '').toLowerCase().includes(search)
  );

  filtered.sort((a, b) => {
    if (sort === 'name-asc') return a.name.localeCompare(b.name);
    if (sort === 'name-desc') return b.name.localeCompare(a.name);
    if (sort === 'price-asc') return parseFloat(a.price) - parseFloat(b.price);
    if (sort === 'price-desc') return parseFloat(b.price) - parseFloat(a.price);
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📦</div><p>${products.length === 0 ? 'No products yet. Ask your supplier to add products.' : 'No products match your search.'}</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <div class="product-card" onclick="openProduct('${p.id}')">
      ${p.image ? `<div class="product-img"><img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='<div style=\\'width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:40px;color:#e2ddd6\\'>📦</div>'"/></div>` : `<div class="product-img-placeholder">📦</div>`}
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">R${parseFloat(p.price).toFixed(2)}</div>
        ${p.description ? `<div class="product-desc">${p.description}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function openProduct(id) {
  currentProduct = products.find(p => p.id === id);
  currentQty = 1;
  if (!currentProduct) return;
  document.getElementById('modal-content').innerHTML = `
    ${currentProduct.image ? `<img class="modal-img" src="${currentProduct.image}" alt="${currentProduct.name}" onerror="this.outerHTML='<div class=\\'modal-img-placeholder\\'>📦</div>'"/>` : `<div class="modal-img-placeholder">📦</div>`}
    <div class="modal-name">${currentProduct.name}</div>
    <div class="modal-price">R${parseFloat(currentProduct.price).toFixed(2)}</div>
    ${currentProduct.description ? `<div class="modal-desc">${currentProduct.description}</div>` : ''}
    <div class="qty-label">Quantity</div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <span class="qty-num" id="modal-qty">1</span>
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>
    <div class="modal-total">Total: <strong id="modal-total">R${parseFloat(currentProduct.price).toFixed(2)}</strong></div>
    <button class="add-btn" onclick="addToCart()">Add to order</button>
  `;
  document.getElementById('product-modal').classList.add('open');
}

function changeQty(delta) {
  currentQty = Math.max(1, currentQty + delta);
  document.getElementById('modal-qty').textContent = currentQty;
  document.getElementById('modal-total').textContent = 'R' + (parseFloat(currentProduct.price) * currentQty).toFixed(2);
}

function addToCart() {
  const existing = cart.find(i => i.id === currentProduct.id);
  if (existing) { existing.qty += currentQty; } 
  else { cart.push({ id: currentProduct.id, name: currentProduct.name, price: currentProduct.price, qty: currentQty }); }
  updateCartCount();
  closeModal('product-modal');
}

function updateCartCount() {
  const total = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById('cart-count').textContent = total;
}

function openCart() {
  renderCart();
  document.getElementById('cart-modal').classList.add('open');
  document.getElementById('success-msg').style.display = 'none';
  document.getElementById('submit-btn').style.display = 'block';
}

function renderCart() {
  const container = document.getElementById('cart-items');
  const totalRow = document.getElementById('cart-total-row');
  if (cart.length === 0) {
    container.innerHTML = '<div class="cart-empty">Your cart is empty</div>';
    totalRow.innerHTML = '';
    return;
  }
  container.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div>
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-detail">Qty: ${item.qty} × R${parseFloat(item.price).toFixed(2)}</div>
      </div>
      <div style="display:flex;align-items:center">
        <span class="cart-item-price">R${(item.qty * parseFloat(item.price)).toFixed(2)}</span>
        <button class="remove-btn" onclick="removeFromCart('${item.id}')">✕</button>
      </div>
    </div>
  `).join('');
  const total = cart.reduce((s, i) => s + i.qty * parseFloat(i.price), 0);
  totalRow.innerHTML = `<div class="cart-total-row"><span>Total</span><span>R${total.toFixed(2)}</span></div>`;
}

function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  updateCartCount();
  renderCart();
}

function submitOrder() {
  const name = document.getElementById('franchise-name').value.trim();
  if (!name) { alert('Please enter your franchise name.'); return; }
  if (cart.length === 0) { alert('Your cart is empty.'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  const total = cart.reduce((s, i) => s + i.qty * parseFloat(i.price), 0);
  const orderData = {
    franchiseName: name,
    items: cart.map(i => `${i.name} x${i.qty}`).join(', '),
    total: total.toFixed(2),
    date: new Date().toLocaleString('en-ZA')
  };

  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(orderData)
  })
  .then(() => {
    document.getElementById('success-msg').style.display = 'block';
    btn.style.display = 'none';
    cart = [];
    updateCartCount();
  })
  .catch(() => {
    // Fallback: show success anyway and log locally
    document.getElementById('success-msg').style.display = 'block';
    btn.style.display = 'none';
    cart = [];
    updateCartCount();
  });
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});

renderProducts();
</script>
</body>
</html>
